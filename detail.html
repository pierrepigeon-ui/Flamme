<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLAMME — détail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="flamme_moteur.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F4F6F8;--panel:#FFFFFF;--hover:#EEF1F5;--ok:#1E7A46;--warn:#9A5B00;--err:#B42318;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input{font:inherit;color:inherit} :focus-visible{outline:2px solid #3B6FE0;outline-offset:2px} .hidden{display:none!important}
header{display:flex;align-items:baseline;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.wordmark{font:600 24px/1 var(--serif);letter-spacing:.02em;margin:0} .signature{font:italic 14px/1.4 var(--serif);color:var(--muted);margin:0}
header nav a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:5px} header nav a:hover{background:var(--hover);color:var(--ink)}
.who{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.msg{font-size:14px;min-height:1.4em;margin:6px 0 0} .msg.err{color:var(--err)}
.bloque{max-width:560px;margin:60px auto;padding:0 20px;font:italic 17px/1.5 var(--serif);color:var(--muted)}
.outils{max-width:1000px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}

/* détail */
main{max-width:1400px;margin:16px auto 40px;padding:0 20px}
.carte-entete{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.carte-entete h1{font:600 26px/1.2 var(--serif);margin:0 0 4px}
.carte-entete .meta{color:var(--muted);font-size:14px}
.familles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.fam{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fam .t{font-size:12px;color:var(--muted)} .fam .c{font:600 15px var(--serif)} .fam .sc{font-size:13px;color:var(--muted)}
h2{font:600 19px var(--serif);margin:22px 0 10px}
.bandes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bande{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.bande h3{font:600 15px var(--serif);margin:0 0 2px} .bande .lim{font-size:12px;color:var(--muted);margin-bottom:8px}
.chip{display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--hover)}
.chip .cd{font-weight:600;white-space:nowrap} .chip .nm{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .chip .sc{font-variant-numeric:tabular-nums}
.chip.moi{background:#FFF4D6;border-radius:4px;padding:3px 4px}
.b-naturel{border-top:4px solid #1E7A46} .b-accessible{border-top:4px solid #6BA368} .b-situationnel{border-top:4px solid #C9A227}
.b-difficile{border-top:4px solid #D9822B} .b-inaccessible{border-top:4px solid #B42318}
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;break-inside:avoid}
.sect h3{font:600 15px var(--serif);margin:0} .sect .ex{font-size:12px;color:var(--muted);margin:0 0 8px}
.sect table{border-collapse:collapse;width:100%;font-size:13px}
.sect td{padding:2px 4px;border-bottom:1px solid var(--hover)} .sect td.r{color:var(--muted);width:24px} .sect td.s{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sect td.n{color:var(--muted)}
.pips{display:inline-flex;gap:3px;align-items:center;vertical-align:1px}
.pip{width:11px;height:11px;border-radius:50%;border:1px solid #8892A0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pip.sec{width:7px;height:7px} .pip.abs{background:transparent!important;border:1.5px dashed var(--c)} .pip.sep{width:auto;height:auto;border:0;font-size:10px;color:#5B6573}
footer{border-top:1px solid var(--line);background:var(--panel);padding:4px 20px;text-align:right;font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:24px;width:min(380px,92vw)} dialog::backdrop{background:rgba(10,15,25,.45)}
.field{display:block;margin-bottom:12px} .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
@media (max-width:1000px){ .bandes{grid-template-columns:1fr 1fr} .familles{grid-template-columns:1fr 1fr} }
@page{size:A4 landscape;margin:10mm}
@media print{ body{background:#fff} header,.outils,footer,dialog{display:none!important} main{max-width:none;margin:0;padding:0}
  .bande,.sect,.carte-entete{border-color:#ccc} .bandes{grid-template-columns:repeat(5,1fr)} h2{margin-top:12px} }
</style>
</head>
<body>
<header>
  <h1 class="wordmark">FLAMME</h1><p class="signature">Cartographiez votre énergie</p>
  <nav><a href="index.html">Console</a><a href="autotest.html">Autotest</a></nav>
  <div class="who"><span id="who"></span>
    <button class="btn ghost" id="btn-login" type="button">Se connecter</button>
    <button class="btn ghost hidden" id="btn-logout" type="button">Se déconnecter</button></div>
</header>
<p class="bloque" id="bloque">Chargement…</p>
<div class="outils hidden" id="outils">
  <button class="btn" type="button" onclick="window.print()">Imprimer ou enregistrer en PDF</button>
  <a class="btn ghost" id="lien-fiche" href="#">Voir la fiche</a>
</div>
<main class="hidden" id="page"></main>
<footer id="version"></footer>
<dialog id="dlg-login"><form id="form-login"><h2 style="font:600 22px var(--serif);margin:0 0 14px">Se connecter</h2>
  <label class="field"><span>Adresse e-mail</span><input type="email" id="email" autocomplete="username" required></label>
  <label class="field"><span>Mot de passe</span><input type="password" id="password" autocomplete="current-password" required></label>
  <div style="display:flex;gap:10px"><button class="btn" type="submit">Se connecter</button><button class="btn ghost" type="button" id="login-fermer">Fermer</button></div>
  <p class="msg" id="login-msg" role="status"></p></form></dialog>
<script>
const VERSION = { numero:"1.0", date:"2026-09-30 14:50" };
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";
const ACCES = ["proprietaire"];
const M = window.FLAMME_MOTEUR;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => (x * 100).toFixed(1).replace(".", ",") + " %";
const dateFr = d => new Date(d).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
let user = null, role = null, E = {}, C = {};
$("#version").textContent = `Détail ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")} — moteur ${M.VERSION.numero}`;

function pips(code){
  let out = "", absent = false;
  for (const ch of code){
    if (ch === "/"){ absent = true; out += '<span class="pip sep">/</span>'; continue; }
    const up = ch.toUpperCase(), c = C[up]; if (!c) continue;
    const cls = ch === up ? "pip" : (absent ? "pip abs" : "pip sec");
    out += `<span class="${cls}" style="background:${c.couleur};--c:${c.couleur === '#FFFFFF' ? '#8892A0' : c.couleur}"></span>`;
  }
  return `<span class="pips" aria-hidden="true">${out}</span>`;
}
const NOMS_COULEUR = { W:"blanc", U:"bleu", B:"noir", R:"rouge", G:"vert" };
function libelle(code){
  if (E[code]) return E[code].nom;
  if (code.startsWith("/")) return "absence de " + [...code.slice(1).toUpperCase()].map(c => NOMS_COULEUR[c]).join(", ");
  return "";
}

const SECTIONS = [
  ["valeurs", "Valeurs", "1 couleur — score brut"],
  ["valeursPolarisees", "Valeurs polarisées", "1 couleur — valeurs absolues : présence au-dessus de 50 %, absence en dessous"],
  ["motivations", "Motivations", "2 couleurs — données corrigées"],
  ["motivationsPolarisees", "Motivations polarisées", "2 couleurs — valeurs absolues, données corrigées"],
  ["projets", "Projets", "3 couleurs — données corrigées"],
  ["projetsRedresses", "Projets redressés", "3 couleurs — valeurs absolues, données corrigées"],
  ["directions", "Directions", "2 couleurs hiérarchisées — données corrigées"],
  ["temperaments", "Tempéraments", "1 couleur présente, 1 couleur absente"],
  ["polariteMotivations", "Polarité des motivations", "2 couleurs contre 1 (couleur tierce indiquée)"]
];
const BANDES = [["naturel","100 – 75 %"],["accessible","75 – 60 %"],["situationnel","60 – 40 %"],["difficile","40 – 25 %"],["inaccessible","25 – 0 %"]];

async function lireScores(){
  const q = new URLSearchParams(location.search);
  if (q.get("resultat")){
    const { data, error } = await sb.from("resultats").select("*").eq("id", q.get("resultat")).maybeSingle();
    if (error || !data) throw new Error("Ce résultat est introuvable.");
    const { data: pers } = await sb.rpc("personnes"); const p = (pers || []).find(x => x.user_id === data.user_id);
    return { scores: data.scores, date: data.passe_le, qui: p ? (p.nom || p.email) : "" };
  }
  const s = {}; for (const c of M.ORDRE){ const v = parseFloat(String(q.get(c) ?? "").replace(",", ".")); if (!isFinite(v)) throw new Error("Il manque des scores : ouvre le détail depuis la console ou depuis une fiche."); s[c] = v; }
  return { scores: s, date: new Date().toISOString(), qui: "" };
}

function rendre(src){
  const s01 = Object.fromEntries(M.ORDRE.map(c => [c, src.scores[c] / 100]));
  const codesProfils = Object.values(E).filter(e => e.couche === "profil").sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0)).map(e => e.code);
  const st = M.statistiques(s01, codesProfils);
  const moi = new Set(st.profil.codes);
  const fam = (titre, liste) => `<div class="fam"><div class="t">${titre}</div>${liste.map(x => `<div class="c">${pips(x.code)} ${esc(x.code)} ${esc(libelle(x.code))}</div>`).join("")}
    <div class="sc">${liste.length ? pct(liste[0].score) + " — " + liste[0].bande : ""}${liste.length > 1 ? " (égalité)" : ""}</div></div>`;
  $("#page").innerHTML = `
    <section class="carte-entete">
      <h1>Statistiques du profil ${st.profil.codes.map(c => `${pips(c)} ${esc(c)} ${esc(libelle(c))}`).join(" / ")}</h1>
      <div class="meta">${src.qui ? esc(src.qui) + " — " : ""}${dateFr(src.date)} — scores : ${M.ORDRE.map(c => `${c} ${pct(s01[c])}`).join(", ")}${st.profil.frontiere ? " — profil frontière" : ""}</div>
      <div class="familles">
        ${fam("Meilleur radical (1.23)", st.parFamille.radical)}
        ${fam("Meilleur spécialiste (12.3)", st.parFamille.specialiste)}
        ${fam("Meilleur généraliste (12/5)", st.parFamille.generaliste)}
        ${fam("Profil le moins accessible", st.moinsAccessibles)}
      </div>
    </section>
    <h2>Accessibilité des 90 profils</h2>
    <div class="bandes">${BANDES.map(([b, lim]) => {
      const l = st.sections.profils.filter(p => p.bande === b);
      return `<div class="bande b-${b}"><h3>${b[0].toUpperCase() + b.slice(1)} <span style="font:12px var(--sans);color:var(--muted)">(${l.length})</span></h3><div class="lim">${lim}</div>
        ${l.map(p => `<div class="chip${moi.has(p.code) ? " moi" : ""}" title="${esc(libelle(p.code))}"><span class="cd">${esc(p.code)}</span><span class="nm">${esc(libelle(p.code))}</span><span class="sc">${pct(p.score)}</span></div>`).join("") || '<div class="lim">aucun</div>'}</div>`;
    }).join("")}</div>
    <h2>Classements</h2>
    <div class="sections">${SECTIONS.map(([k, titre, ex]) => `<section class="sect"><h3>${titre}</h3><p class="ex">${ex}</p><table>
      ${st.sections[k].map(x => `<tr><td class="r">${x.rang}</td><td>${pips(x.code)} ${esc(x.code)}${x.tiers ? ` <span class="n">+ ${x.tiers}</span>` : ""}</td><td class="n">${esc(libelle(x.code))}</td><td class="s">${pct(x.score)}</td></tr>`).join("")}
      </table></section>`).join("")}</div>`;
  $("#lien-fiche").href = "fiche.html" + location.search;
  document.title = `FLAMME — détail ${st.profil.codes.join(" / ")}`;
}

$("#btn-login").addEventListener("click", () => { $("#login-msg").textContent = ""; $("#dlg-login").showModal(); });
$("#login-fermer").addEventListener("click", () => $("#dlg-login").close());
$("#btn-logout").addEventListener("click", () => sb.auth.signOut());
$("#form-login").addEventListener("submit", async e => { e.preventDefault(); const m = $("#login-msg"); m.className = "msg"; m.textContent = "Connexion…";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error){ m.className = "msg err"; m.textContent = /invalid/i.test(error.message) ? "Adresse ou mot de passe incorrect." : error.message; } else $("#dlg-login").close(); });

sb.auth.onAuthStateChange(async (_e, session) => {
  const u = session?.user || null; if (u?.id === user?.id && role !== null) return;
  user = u; role = null;
  $("#btn-login").classList.toggle("hidden", !!user); $("#btn-logout").classList.toggle("hidden", !user);
  $("#who").textContent = user ? user.email : "";
  ["#page", "#outils"].forEach(s => $(s).classList.add("hidden")); $("#bloque").classList.remove("hidden");
  if (!user){ $("#bloque").textContent = "Le détail est réservé. Connecte-toi pour l'afficher."; return; }
  const { data: r } = await sb.rpc("mon_role"); role = r || "";
  if (!ACCES.includes(role)){ $("#bloque").textContent = "Le détail des statistiques est réservé au propriétaire."; return; }
  try {
    const [{ data: els, error }, { data: cols }] = await Promise.all([sb.from("elements").select("*"), sb.from("couleurs").select("*")]);
    if (error) throw new Error(error.message);
    E = Object.fromEntries(els.map(e => [e.code, e])); C = Object.fromEntries((cols || []).map(c => [c.code, c]));
    rendre(await lireScores());
    $("#bloque").classList.add("hidden"); ["#page", "#outils"].forEach(s => $(s).classList.remove("hidden"));
  } catch (err){ $("#bloque").textContent = err.message; }
});
</script>
</body>
</html>
