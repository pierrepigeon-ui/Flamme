<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISME — La rosace des joueurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F6F5F1;--panel:#FFFFFF;--accent:#3D2645;--sel:#1B2430;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--accent:#C9B4D2}}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:inherit}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:inherit!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)} .barre a{text-decoration:none}
#qui a{margin-left:10px}

.page{max-width:1320px;margin:0 auto;padding:0 20px 30px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.carte{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:8px}
#rosace{display:block;width:100%;height:auto}
#rosace [data-code]{cursor:pointer}
#rosace g[data-code]{transition:opacity .2s}
#rosace .sect{stroke:#FFFFFF;stroke-width:2}
#rosace g[data-code]:hover .sect{filter:brightness(1.06)}
#rosace text{pointer-events:none;font-family:var(--sans)}
#rosace .t-mot{font:600 21px var(--serif);fill:#FFFFFF;letter-spacing:.02em}
#rosace .t-tem{font:600 13.5px var(--sans);fill:#1B2430}
#rosace .t-sty{font:400 12px var(--sans);fill:#1B2430}
#rosace .t-centre{font:600 22px var(--serif);fill:#1B2430;letter-spacing:.12em;text-anchor:middle}
#rosace .t-centre2{font:12px var(--sans);fill:#5B6573;text-anchor:middle}
#rosace .fuit{stroke:#FFFFFF;stroke-width:1.5}
#rosace.chemin g[data-code]:not(.surligne){opacity:.25}
#rosace g.choisi .sect{stroke:var(--sel);stroke-width:4}
#rosace g.vous .sect{stroke:#1B2430;stroke-width:6}
.outils{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin:10px 4px 0}
.bascule{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:999px;padding:6px 14px;font:500 13.5px var(--sans);cursor:pointer}
.bascule[aria-pressed="false"]{background:transparent;color:var(--ink);border-color:var(--line)}
aside{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-height:calc(100vh - 28px);overflow:auto}
aside .niveau{font-size:13px;color:var(--muted);margin:0}
aside h1{font:600 30px/1.15 var(--serif);margin:2px 0 4px}
aside .fil{font:italic 16px var(--serif);color:var(--muted);margin:0 0 12px}
aside p{font:16px/1.6 var(--serif);margin:0 0 10px}
aside .lib{display:block;font:600 12.5px var(--sans);color:var(--muted);margin-top:6px}
aside ul{margin:4px 0 10px;padding-left:18px;font:15.5px/1.5 var(--serif)}
aside .lien{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
aside .p-totem{float:right;width:78px;height:78px;margin:0 0 6px 12px;padding:10px;border-radius:16px;background:var(--paper)}
aside .vous-badge{display:inline-block;font:600 12px var(--sans);color:#fff;background:#1B2430;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:4px}
.version{font-size:12px;color:var(--muted);text-align:right;max-width:1320px;margin:0 auto;padding:0 20px 20px}
@media (max-width:980px){ .page{grid-template-columns:1fr} aside{position:static;max-height:none} }
</style>
</head>
<body>
<div class="barre"><a href="index.html" class="marque" title="Accueil de PRISME">PRISME</a><span id="qui"></span></div>
<div class="page">
  <div>
    <div class="carte"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-510 -510 1020 1020" id="rosace" role="img" aria-label="Rosace PRISMEplayer : 5 moteurs, 20 tempéraments, 60 styles"></svg></div>
    <div class="outils"><span>Cliquez sur un secteur pour le découvrir. Le point coloré d'un tempérament indique le moteur qu'il fuit ; la couleur d'un style, son second moteur.</span>
      <button type="button" id="bascule" class="bascule" aria-pressed="true" hidden>Surbrillance de mon profil : activée</button></div>
  </div>
  <aside id="panneau"><p class="niveau">Chargement…</p></aside>
</div>
<p class="version"><span id="credit"></span><br><span id="version"></span></p>

<script src="timeline.js?v=1.4"></script>
<script src="totems.js?v=1"></script>
<script>
const VERSION = { numero:"2.1", date:"2026-10-11 00:20" };   // à incrémenter à chaque livraison
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";   // clé publique : protégée par les droits de la base
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maj = s => { s = String(s ?? ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const sansArticle = s => String(s ?? "").replace(/^(le |la |les |l')/i, "");
const virg = v => String(v).replace(".", ",");
$("#version").textContent = `Rosace PRISMEplayer ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")} · timeline ${TIMELINE_VERSION.numero}`;

const B = {};      // le modèle, lu dans la base
let vous = null;   // dernier résultat de la personne connectée : { style, passe_le }
let choisi = null;

/* ---- connexion : tout passe par la Forge (portail commun, à la racine du site) ---- */
const versForge = () => "../?retour=" + encodeURIComponent(location.href);
function afficherCompte(u){
  const el = document.getElementById("qui");
  el.innerHTML = u ? `<span>${String(u.email).replace(/[&<>"']/g, "")}</span> <a href="#" id="deconnexion">Se déconnecter</a>`
                   : `<a href="${versForge()}">Se connecter</a>`;
  const d = document.getElementById("deconnexion");
  if (d) d.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  afficherCompte(session?.user || null);
  if (!demarre){ demarre = true; setTimeout(() => demarrer(session?.user || null), 0); }
});

async function demarrer(user){
  const lire = t => sb.from(t).select("*").order("ordre");
  const r = await Promise.all([lire("prisme_player_moteurs"), lire("prisme_player_temperaments"), lire("prisme_player_styles"), chargerTotems()]);
  const err = r.find(x => x.error);
  if (err){ $("#panneau").innerHTML = `<p>Lecture du modèle impossible : ${esc(err.error.message)}</p>`; return; }
  [B.moteurs, B.temps, B.styles] = r.slice(0, 3).map(x => x.data);
  B.M = Object.fromEntries(B.moteurs.map(m => [m.code, m]));
  B.T = Object.fromEntries(B.temps.map(t => [t.code, t]));
  B.S = Object.fromEntries(B.styles.map(s => [s.code, s]));
  if (user){
    const { data } = await sb.from("prisme_player_resultats").select("style,classement,passe_le").eq("user_id", user.id).order("passe_le", { ascending:false }).limit(1);
    const d = data?.[0];
    if (d){ const c = d.classement; vous = { ...d, style: d.style || (c ? c[0] + "." + c[1].toLowerCase() + "/" + c[4].toLowerCase() : null) }; }
    if (vous && !B.S[vous.style]) vous = null;
  }
  dessiner();
  if (vous){
    $("#bascule").hidden = false;
    surligner(); montrer(vous.style);
  } else montrerAccueil(!!user);
}

/* ---- le dessin, généré : centre, moteurs (72°), tempéraments (18°), styles (6°) ---- */
const R0 = 92, R1 = 198, R2 = 376, R3 = 500;          // rayons : centre, moteurs, tempéraments, styles
function teinte(hex, k){                                 // mélange avec le blanc : k = part de blanc
  const n = parseInt(String(hex).slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * k));
  return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
}
const fonce = (hex, k) => { const n = parseInt(String(hex).slice(1), 16); return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * (1 - k)).toString(16).padStart(2, "0")).join(""); };
const pol = (r, a) => [r * Math.sin(a * Math.PI / 180), -r * Math.cos(a * Math.PI / 180)];   // a en degrés, 0 = en haut, sens horaire
function secteur(r1, r2, a1, a2){
  const [x1, y1] = pol(r2, a1), [x2, y2] = pol(r2, a2), [x3, y3] = pol(r1, a2), [x4, y4] = pol(r1, a1), g = a2 - a1 > 180 ? 1 : 0;
  return `M${x1.toFixed(2)},${y1.toFixed(2)} A${r2},${r2} 0 ${g} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${x3.toFixed(2)},${y3.toFixed(2)} A${r1},${r1} 0 ${g} 0 ${x4.toFixed(2)},${y4.toFixed(2)}Z`;
}
// texte radial, lisible de gauche à droite des deux côtés
function radial(txt, a, r1, r2, cls){
  a = ((a % 360) + 360) % 360;
  const bas = a > 180, rot = bas ? a + 90 : a - 90, [x, y] = pol((r1 + r2) / 2, a);
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${cls}" text-anchor="middle" dominant-baseline="central" transform="rotate(${rot.toFixed(2)} ${x.toFixed(1)} ${y.toFixed(1)})">${esc(txt)}</text>`;
}
// texte courbe sur le cercle des moteurs (à l'endroit en haut, retourné en bas)
function courbe(id, txt, a1, a2, r, cls){
  const bas = (a1 + a2) / 2 > 90 && (a1 + a2) / 2 < 270, [x1, y1] = pol(r, bas ? a2 : a1), [x2, y2] = pol(r, bas ? a1 : a2);
  return `<path id="${id}" d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 0 ${bas ? 0 : 1} ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none"/>
    <text class="${cls}" dominant-baseline="central"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${esc(txt)}</textPath></text>`;
}
function dessiner(){
  const svg = $("#rosace"), ORD = "WUBRG";
  let h = `<rect x="-510" y="-510" width="1020" height="1020" fill="#FFFFFF"/>`;
  B.moteurs.forEach((m, i) => {
    const a1 = -36 + i * 72, a2 = a1 + 72;
    h += `<g data-code="${m.code}" data-niveau="moteur"><title>${esc(m.nom)}</title><path class="sect" d="${secteur(R0, R1, a1, a2)}" fill="${m.couleur}"/>${courbe("arc-" + m.code, m.nom, a1, a2, (R0 + R1) / 2 + 4, "t-mot")}</g>`;
    const T = B.temps.filter(t => t.moteur === m.code).sort((x, y) => x.ordre - y.ordre);
    T.forEach((t, j) => {
      const b1 = a1 + j * 18, b2 = b1 + 18, f = B.M[t.fuit], [fx, fy] = pol(R2 - 13, b1 + 9), [ix, iy] = pol(R1 + 27, b1 + 9);
      h += `<g data-code="${esc(t.code)}" data-niveau="temperament"><title>${esc(maj(t.nom))} · fuit ${esc(f.nom)}</title>
        <path class="sect" d="${secteur(R1, R2, b1, b2)}" fill="${teinte(m.couleur, .55)}"/>
        ${TOTEMS.svg[t.code] ? `<g transform="translate(${(ix - 17).toFixed(1)} ${(iy - 17).toFixed(1)})">${totemSVG(t.code, fonce(m.couleur, .35), { titre:"", attrs:'width="34" height="34"' })}</g>` : ""}
        ${radial(maj(sansArticle(t.nom)), b1 + 9, R1 + (TOTEMS.svg[t.code] ? 50 : 4), R2 - 26, "t-tem")}
        <circle class="fuit" cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="8" fill="${f.couleur}"/></g>`;
      const S = B.styles.filter(s => s.temperament === t.code).sort((x, y) => x.ordre - y.ordre);
      S.forEach((s, k) => {
        const c1 = b1 + k * 6, c2 = c1 + 6, q = s.nom.slice(t.nom.length).trim() || s.nom;
        h += `<g data-code="${esc(s.code)}" data-niveau="style"><title>${esc(maj(s.nom))} (${esc(s.code)})</title>
          <path class="sect" d="${secteur(R2, R3, c1, c2)}" fill="${teinte(B.M[s.second].couleur, .7)}"/>${radial(q, c1 + 3, R2, R3, "t-sty")}</g>`;
      });
    });
  });
  h += `<circle r="${R0 - 2}" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="2"/><text class="t-centre" y="2">PRISME</text><text class="t-centre2" y="24">joueurs</text>`;
  svg.innerHTML = h;
  if (Object.keys(TOTEMS.svg).length) $("#credit").innerHTML = TOTEMS_CREDIT;
  svg.addEventListener("click", e => { const el = e.target.closest("[data-code]"); if (el) montrer(el.dataset.code); });
}

const niveauDe = code => code.includes(".") ? "style" : code.includes("/") ? "temperament" : "moteur";
const groupe = code => $(`#rosace g[data-code="${CSS.escape(code)}"]`);
const chaine = code => [code, code[0] + "/" + code[4], code[0]];     // le style, son tempérament, son moteur
let surbrillance = true;
function surligner(){
  const svg = $("#rosace");
  svg.querySelectorAll(".surligne,.vous").forEach(e => e.classList.remove("surligne", "vous"));
  svg.classList.remove("chemin");
  if (!vous || !surbrillance) return;
  chaine(vous.style).forEach(code => groupe(code)?.classList.add("surligne"));
  groupe(vous.style)?.classList.add("vous");
  svg.classList.add("chemin");
}
$("#bascule").addEventListener("click", () => {
  surbrillance = !surbrillance;
  $("#bascule").setAttribute("aria-pressed", surbrillance);
  $("#bascule").textContent = "Surbrillance de mon profil : " + (surbrillance ? "activée" : "désactivée");
  surligner();
});

const puces = t => `<ul>${String(t ?? "").split("\n").filter(Boolean).map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
const moment = m => m.climax_jalon == null ? "Transversal : prolonge l'apogée, quelle que soit la phase" : `${esc(m.climax_phase)} (jalon ${virg(m.climax_jalon)})`;
function montrer(code){
  document.querySelectorAll("#rosace g.choisi").forEach(e => e.classList.remove("choisi"));
  groupe(code)?.classList.add("choisi");
  choisi = code;
  const N = niveauDe(code), M = B.M, estVous = vous && chaine(vous.style).includes(code);
  const badge = estVous ? '<span class="vous-badge">vous</span>' : "";
  const lien = (c, t) => `<span class="lien" data-aller="${esc(c)}">${esc(t)}</span>`;
  let h;
  if (N === "moteur"){
    const m = M[code];
    h = `<p class="niveau">Moteur : pourquoi je joue</p><h1 style="color:${m.couleur}">${esc(m.nom)}${badge}</h1>
      <p class="fil">${esc(m.devise)}${m.citation ? ` · « ${esc(m.citation)} »` : ""}</p>
      <p>${esc(m.texte)}</p>
      ${m.a_la_table ? `<span class="lib">À la table, il peut</span>${puces(m.a_la_table)}` : ""}
      <span class="lib">Quand il est rejeté</span><p>${esc(m.fragilite)}</p>
      <span class="lib">Son moment</span><p>${m.phase_cle ? esc(maj(m.phase_cle)) : moment(m)}</p>
      <span class="lib">Ses quatre tempéraments</span><ul>${B.temps.filter(t => t.moteur === code).map(t => `<li>${lien(t.code, maj(t.nom))} : fuit ${esc(M[t.fuit].nom.toLowerCase())}</li>`).join("")}</ul>`;
  } else if (N === "temperament"){
    const t = B.T[code], m = M[t.moteur];
    h = `${totemSVG(code, m.couleur, { cls:"p-totem", titre: t.totem ? maj(t.totem) : undefined })}<p class="niveau">Tempérament : ce que je cherche, ce que je fuis</p><h1>${esc(maj(t.nom))}${badge}</h1>
      <p class="fil">${lien(m.code, m.nom)}, fuit ${esc(M[t.fuit].nom.toLowerCase())}</p>
      <p>${esc(t.qui_il_est)}</p>
      <span class="lib">À la table, il peut</span>${puces(t.a_la_table)}
      <span class="lib">Quand il décroche</span><p>${esc(t.quand_decroche)}</p>
      ${t.totem ? `<span class="lib">Son totem</span><p>${esc(maj(t.totem))}. ${esc(t.totem_raison || "")}</p>` : ""}
      ${t.fb_verbe ? `<span class="lib">Dans Flamme Bleue</span><p>${esc(t.fb_verbe)} (« ${esc(t.fb_devise)} »)</p>` : ""}
      <span class="lib">Ses trois styles</span><ul>${B.styles.filter(s => s.temperament === code).map(s => `<li>${lien(s.code, maj(s.nom))} : avec ${esc(M[s.second].nom.toLowerCase())}</li>`).join("")}</ul>`;
  } else {
    const s = B.S[code], t = B.T[s.temperament], m = M[t.moteur];
    h = `${totemSVG(t.code, m.couleur, { cls:"p-totem", titre: t.totem ? maj(t.totem) : undefined })}<p class="niveau">Style : avec quoi je le vis</p><h1>${esc(maj(s.nom))}${badge}</h1>
      <p class="fil">${lien(t.code, maj(t.nom))}, moteur ${lien(m.code, m.nom)}</p>
      <p>${s.texte ? esc(s.texte) : `Style ${esc(s.code)} : ${esc(t.nom)}, avec ${esc(M[s.second].nom)} en second moteur.`}</p>
      <span class="lib">Second moteur</span><p>${esc(M[s.second].nom)} : ${esc(M[s.second].devise)}</p>
      <span class="lib">Son moment</span><p>${moment(m)}</p>
      <span class="lib">Ce qui le fait décrocher</span><p>${esc(t.quand_decroche)}</p>
      ${estVous && code === vous.style ? '<p><a href="fiche.html">Voir ma fiche de joueur complète</a></p>' : ""}`;
  }
  $("#panneau").innerHTML = h + `<div id="jeux-joueur"><span class="lib">Ses jeux</span><p class="pj-discret">Calcul en cours…</p></div>`;
  afficherJeux(code, N);
  $("#panneau").querySelectorAll("[data-aller]").forEach(x => x.addEventListener("click", () => montrer(x.dataset.aller)));
}
/* ---- l'inverse du spectromètre : les jeux évalués, classés pour ce joueur ---- */
let J = null;   // jeux évalués, lus une fois (lecture et tableau partagés : timeline.js)
async function afficherJeux(code, N){
  const box = document.getElementById("jeux-joueur"); J ??= await lireJeuxEvalues(sb);
  if (choisi !== code || !box?.isConnected) return;
  if (J.refus){ box.innerHTML = `<span class="lib">Ses jeux</span><p class="pj-discret">Les jeux évalués sont réservés aux membres de PRISME.</p>`; return; }
  const L = jeuxPourJoueurs(J.fiches, J.paires, J.axes, null, stylesDe(code, B.styles));
  box.innerHTML = `<span class="lib">Ses jeux</span>` + tableJeuxHTML(L, J, N === "style" ? "lui" : N === "temperament" ? "ses trois styles" : "ses douze styles", N !== "style");
}
function montrerAccueil(connecte){
  $("#panneau").innerHTML = `<p class="niveau">La rosace des joueurs</p><h1>Cinq moteurs, vingt tempéraments, soixante styles</h1>
    <p>Au centre, le moteur : pourquoi l'on joue. Au milieu, le tempérament : ce que l'on cherche et ce que l'on fuit. Au bord, le style : le second moteur, avec lequel on le vit.</p>
    <p>Cliquez sur un secteur pour le découvrir.</p>
    <p>${connecte ? '<a href="questionnaire.html">Passez le questionnaire</a> pour voir votre place sur la rosace.'
                  : `<a href="${versForge()}">Connectez-vous</a> et passez le <a href="questionnaire.html">questionnaire du joueur</a> pour voir votre place sur la rosace.`}</p>`;
}
</script>
<script src="entete.js?v=1.2"></script>
</body>
</html>
