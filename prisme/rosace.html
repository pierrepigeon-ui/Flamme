<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F6F5F1;--panel:#FFFFFF;--accent:#3D2645;--sel:#1B2430;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--accent:#C9B4D2}}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:inherit}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:inherit!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)} .barre a{text-decoration:none}
#qui a{margin-left:10px}

.page{max-width:1320px;margin:0 auto;padding:0 20px 30px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.carte{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:8px}
#rosace{display:block;width:100%;height:auto}
#rosace [data-code]{cursor:pointer}
#rosace path[data-code]{transition:opacity .2s}
#rosace.chemin [data-code]:not(.surligne){opacity:.28}
#rosace path.choisi{stroke:var(--sel);stroke-width:7}
#rosace path.vous{stroke:#1B2430;stroke-width:9}
.outils{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin:10px 4px 0}
.bascule{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:999px;padding:6px 14px;font:500 13.5px var(--sans);cursor:pointer}
.bascule[aria-pressed="false"]{background:transparent;color:var(--ink);border-color:var(--line)}
aside{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-height:calc(100vh - 28px);overflow:auto}
aside .niveau{font-size:13px;color:var(--muted);margin:0}
aside h1{font:600 30px/1.15 var(--serif);margin:2px 0 4px}
aside .fil{font:italic 16px var(--serif);color:var(--muted);margin:0 0 12px}
aside p{font:16px/1.6 var(--serif);margin:0 0 10px}
aside .lib{display:block;font:600 12.5px var(--sans);color:var(--muted);margin-top:6px}
aside ul{margin:4px 0 10px;padding-left:18px;font:15.5px/1.5 var(--serif)}
aside .lien{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
aside .vous-badge{display:inline-block;font:600 12px var(--sans);color:#fff;background:#1B2430;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:4px}
.version{font-size:12px;color:var(--muted);text-align:right;max-width:1320px;margin:0 auto;padding:0 20px 20px}
@media (max-width:980px){ .page{grid-template-columns:1fr} aside{position:static;max-height:none} }
</style>
</head>

/* ---- connexion : tout passe par la Forge (portail commun, à la racine du site) ---- */
const versForge = () => "../?retour=" + encodeURIComponent(location.href);
function afficherCompte(u){
  const el = document.getElementById("qui");
  el.innerHTML = u ? `<span>${String(u.email).replace(/[&<>"']/g, "")}</span> <a href="#" id="deconnexion">Se déconnecter</a>`
                   : `<a href="${versForge()}">Se connecter</a>`;
  const d = document.getElementById("deconnexion");
  if (d) d.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  afficherCompte(session?.user || null);
  if (!demarre){ demarre = true; setTimeout(() => demarrer(session?.user || null), 0); }
});

async function demarrer(user){
  const lire = t => sb.from(t).select("*").order("ordre");
  const r = await Promise.all([lire("prisme_player_moteurs"), lire("prisme_player_archetypes"), lire("prisme_player_profils"), lire("prisme_player_sous_profils")]);
  const err = r.find(x => x.error);
  if (err){ $("#panneau").innerHTML = `<p>Lecture du modèle impossible : ${esc(err.error.message)}</p>`; return; }
  [B.moteurs, B.archetypes, B.profils, B.sous] = r.map(x => x.data);
  B.M = Object.fromEntries(B.moteurs.map(m => [m.code, m]));
  if (user){
    const { data } = await sb.from("prisme_player_resultats").select("sous_profil,passe_le").eq("user_id", user.id).order("passe_le", { ascending:false }).limit(1);
    vous = data?.[0] || null;
  }
  preparerDessin();
  if (vous){
    $("#bascule").hidden = false;
    surligner(); montrer(vous.sous_profil);
  } else montrerAccueil(!!user);
}

/* Rattache chaque élément du dessin à son code, et remplace les noms par ceux de la base */
function preparerDessin(){
  const svg = $("#rosace");
  const parNom = {}; Object.entries(NOMS_DESSIN).forEach(([code, nom]) => parNom[nom.toUpperCase()] = code);
  const actuel = {}; B.archetypes.concat(B.profils, B.sous).forEach(x => actuel[x.code] = x.nom);
  const moteurParNom = {}; Object.entries(MOTEURS_DESSIN).forEach(([c, n]) => moteurParNom[n.toLowerCase()] = c);
  let courant = null;
  [...svg.children].forEach(el => {
    const suivant = el.nextElementSibling;
    if (el.tagName === "path" && suivant?.tagName === "text" && parNom[suivant.textContent]){
      courant = parNom[suivant.textContent];
    }
    if (el.tagName === "circle") courant = null;   // le disque central n'appartient à aucun secteur
    if (courant && el.tagName !== "rect" && el.tagName !== "defs") el.dataset.code = courant;
  });
  svg.querySelectorAll("text").forEach(t => {
    const code = parNom[t.textContent];
    if (code && actuel[code]) t.textContent = actuel[code].toUpperCase();
    const m = moteurParNom[t.textContent];
    if (m && B.M[m]) t.textContent = B.M[m].nom.toLowerCase();
  });
  // le centre (et ce qui n'appartient à aucun secteur) ne réagit pas au clic
  svg.addEventListener("click", e => { const el = e.target.closest("[data-code]"); if (el) montrer(el.dataset.code); });
}

const niveauDe = code => code.includes(".") ? "sous" : code.includes("/") ? "profil" : "archetype";
const secteur = code => $(`#rosace path[data-code="${CSS.escape(code)}"]`);
function chaine(code){   // le sous-profil, son profil, son archétype
  const sp = B.sous.find(s => s.code === code), p = B.profils.find(x => x.code === sp?.profil);
  return [code, p?.code, p?.archetype].filter(Boolean);
}
let surbrillance = true;
function surligner(){
  const svg = $("#rosace");
  svg.querySelectorAll(".surligne,.vous").forEach(e => e.classList.remove("surligne", "vous"));
  svg.classList.remove("chemin");
  if (!vous || !surbrillance) return;
  const c = chaine(vous.sous_profil);
  c.forEach(code => svg.querySelectorAll(`[data-code="${CSS.escape(code)}"]`).forEach(e => e.classList.add("surligne")));
  secteur(vous.sous_profil)?.classList.add("vous");
  svg.classList.add("chemin");
}
// une seule bascule : tout (estompage et contour) s'allume ou s'éteint ensemble
$("#bascule").addEventListener("click", () => {
  surbrillance = !surbrillance;
  $("#bascule").setAttribute("aria-pressed", surbrillance);
  $("#bascule").textContent = "Surbrillance de mon profil : " + (surbrillance ? "activée" : "désactivée");
  surligner();
});

      <span class="lib">Ses deux profils</span><ul>${profs.map(p => `<li>${lien(p.code, p.nom)} : rejette ${esc(M[p.rejetee].nom.toLowerCase())}</li>`).join("")}</ul>`;

    const p = B.profils.find(x => x.code === code), a = B.archetypes.find(x => x.code === p.archetype);
    h = `<p class="niveau">Profil : qu'est-ce qui me fait décrocher ?</p><h1>${esc(p.nom)}${badge}</h1>
      <p class="fil">Archétype ${lien(a.code, a.nom)}</p>
      <span class="lib">Moteur rejeté</span><p>${esc(M[p.rejetee].nom)}</p>
      <span class="lib">Ce qui le fait décrocher</span><p>${esc(M[p.rejetee].fragilite)}</p>
      <span class="lib">Ses trois sous-profils</span><ul>${B.sous.filter(s => s.profil === code).map(s => `<li>${lien(s.code, s.nom)} : dominante ${esc(M[s.dominante].nom.toLowerCase())}</li>`).join("")}</ul>`;
  } else {
    const s = B.sous.find(x => x.code === code), p = B.profils.find(x => x.code === s.profil), a = B.archetypes.find(x => x.code === p.archetype), d = M[s.dominante];
    h = `<p class="niveau">Sous-profil : qu'est-ce qui me nourrit ?</p><h1>${esc(s.nom)}${badge}</h1>
      <p class="fil">${lien(p.code, p.nom)}, archétype ${lien(a.code, a.nom)}</p>
      <span class="lib">Adore</span><p>${esc(s.adore)}</p>
      <span class="lib">Déteste</span><p>${esc(s.deteste)}</p>
      <span class="lib">On lui reproche</span><p>${esc(s.reproche)}</p>
      <span class="lib">Son moment</span><p>${d.climax_jalon == null ? "Transversal : prolonge l'apogée, quelle que soit la phase" : esc(d.climax_phase) + " (jalon " + String(d.climax_jalon).replace(".", ",") + ")"}, apogée ${esc(d.duree_apogee)}. Moteur dominant : ${esc(d.nom.toLowerCase())}.</p>
      <span class="lib">Ce qui le fait décrocher</span><p>${esc(M[p.rejetee].fragilite)}</p>
      ${estVous && code === vous.sous_profil ? '<p><a href="fiche.html">Voir ma fiche de joueur complète</a></p>' : ""}`;
  }
  $("#panneau").innerHTML = h + `<div id="jeux-joueur"><span class="lib">Ses jeux</span><p class="pj-discret">Calcul en cours…</p></div>`;
  afficherJeux(code, N);
  $("#panneau").querySelectorAll("[data-aller]").forEach(x => x.addEventListener("click", () => montrer(x.dataset.aller)));
}
/* ---- l'inverse du spectromètre : les jeux évalués, classés pour ce joueur ---- */
let J = null;   // jeux évalués, lus une fois (lecture et tableau partagés : timeline.js)
async function afficherJeux(code, N){
  const box = document.getElementById("jeux-joueur"); J ??= await lireJeuxEvalues(sb);
  if (choisi !== code || !box?.isConnected) return;
  if (J.refus){ box.innerHTML = `<span class="lib">Ses jeux</span><p class="pj-discret">Les jeux évalués sont réservés aux membres de PRISME.</p>`; return; }
  const codes = N === "sous" ? [code] : N === "profil" ? B.sous.filter(x => x.profil === code).map(x => x.code)
    : B.sous.filter(x => B.profils.find(p => p.code === x.profil)?.archetype === code).map(x => x.code);
  const L = jeuxPourJoueurs(J.fiches, J.paires, J.axes, { moteurs:B.moteurs, archetypes:B.archetypes, profils:B.profils, sousprofils:B.sous }, codes);
  box.innerHTML = `<span class="lib">Ses jeux</span>` + tableJeuxHTML(L, J, N === "sous" ? "lui" : N === "profil" ? "ses trois sous-profils" : "ses six sous-profils", N !== "sous");
}
function montrerAccueil(connecte){
  $("#panneau").innerHTML = `<p class="niveau">La rosace des joueurs</p><h1>Dix archétypes, vingt profils, soixante sous-profils</h1>
    <p>Au centre, l'archétype : pourquoi l'on joue. Au milieu, le profil : ce qui fait décrocher. Au bord, le sous-profil : ce qui nourrit le plus.</p>
    <p>Cliquez sur un secteur pour le découvrir.</p>
    <p>${connecte ? '<a href="questionnaire.html">Passez le questionnaire</a> pour voir votre place sur la rosace.'
                  : `<a href="${versForge()}">Connectez-vous</a> et passez le <a href="questionnaire.html">questionnaire du joueur</a> pour voir votre place sur la rosace.`}</p>`;
}
