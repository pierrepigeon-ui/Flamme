<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISME — Évaluer un jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F6F5F1;--panel:#FFFFFF;--accent:#3D2645;--ok:#1E7A46;--warn:#9A5B00;--err:#B42318;
  --SYS:#4f6b8f;--EXP:#7a5c8f;--EDI:#6b8f5c;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--accent:#C9B4D2;--ok:#5CC98A;--warn:#E0A84A;--err:#F2837A;--SYS:#8aa6cc;--EXP:#b49ccc;--EDI:#9cc58c}}
*{box-sizing:border-box} html{scroll-padding-top:70px} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);padding-bottom:90px}
button,input,select{font:inherit;color:inherit} :focus-visible{outline:2px solid #3B6FE0;outline-offset:2px} .hidden{display:none!important}
a{color:inherit}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:inherit!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)} .barre a{text-decoration:none}
#qui a{margin-left:10px}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)} .btn:disabled{opacity:.4;cursor:default}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
h1{font:600 34px/1.15 var(--serif);margin:6px 0 4px}
.aide{color:var(--muted);font-size:14px;max-width:70ch;margin:0 0 12px}
.choix{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.choix label{display:block;font-size:13px;color:var(--muted)} .choix select,.choix input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);min-width:240px}
.msg{font-size:14px} .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
table.fiches{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.fiches th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 12px}
table.fiches td{border-bottom:1px solid var(--line);padding:9px 12px} table.fiches tr.f{cursor:pointer} table.fiches tr.f:hover{background:var(--paper)}
.badge{font:500 11.5px var(--sans);border:1px solid currentColor;border-radius:3px;padding:0 5px}
.badge.finale{color:var(--ok)} .badge.brouillon{color:var(--warn)}

/* barre de la fiche */
#barre-fiche{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding:9px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#barre-fiche .jeu{font:600 18px var(--serif)}
#barre-fiche .prog{flex:1 1 140px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:100px}
#barre-fiche .prog span{display:block;height:100%;background:var(--accent);width:0}
#barre-fiche select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
#etat{font-size:13px;color:var(--muted);min-width:150px}

.chapitre h2{font:600 22px var(--serif);color:var(--chap);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--chap);display:flex;gap:10px;align-items:baseline}
.chapitre h2 .moy{margin-left:auto;font:500 15px var(--sans);color:var(--muted)}
.paire{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;scroll-margin-top:70px}
.paire.faite{border-left:4px solid var(--ok)}
.paire .tete{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.paire h3{font:600 19px var(--serif);margin:0}
.paire .meca{font-size:12.5px;color:var(--muted);font-style:italic}
.na{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:6px 0 10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.paire.sans-objet .axes,.paire.sans-objet .res{opacity:.35;pointer-events:none}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pile{display:flex;flex-direction:column;gap:14px}
.axe .titre{font-weight:600;font-size:14px} .axe .q{font:italic 14px/1.4 var(--serif);color:var(--muted);margin:2px 0 6px}
.ligne{display:flex;gap:10px;align-items:center}
.piste{flex:1;min-width:0}
.piste input{width:100%;margin:0;display:block;accent-color:var(--accent);cursor:pointer}
.piste input.vierge{opacity:.4}
.piste input::-webkit-slider-thumb{width:16px} .piste input::-moz-range-thumb{width:16px}
.grad{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 8px}
.num{font-variant-numeric:tabular-nums;font-weight:600;min-width:2.6em;text-align:right;color:var(--accent)}
.palier{font-size:13.5px;margin-top:5px;min-height:2.6em;line-height:1.4} .palier .vide{color:var(--muted);font-style:italic}
.reperes{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px}
.res{margin-top:12px;padding-top:9px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)} .res b{color:var(--ink);font-size:16px}
#pied{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:9px 20px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;z-index:15}
#pied div{text-align:center} #pied small{display:block;font-size:12px;color:var(--muted)} #pied b{font-size:18px;font-variant-numeric:tabular-nums} #pied .final b{font-size:22px;color:var(--accent)}
.version{font-size:12px;color:var(--muted);text-align:right;margin:26px 0 0}
@media (max-width:640px){ .axes{grid-template-columns:1fr} h1{font-size:28px} .choix select,.choix input{min-width:0;width:100%} }

/* --- version 2 --- */
.chiffres{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:18px 0 6px}
.chiffres h2{font:600 19px var(--serif);margin:0 0 4px}
.chiffres .grille{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.chiffres label{font-size:12.5px;color:var(--muted)} .chiffres input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.paire .tete{cursor:pointer}
.paire .tete .note{margin-left:auto;font:600 15px var(--sans);color:var(--accent);margin-right:10px}
.paire.repliee .corps{display:none}
.paire .fleche{color:var(--muted);font-size:13px}
.paliers{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}
.paliers li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;font-size:13px;line-height:1.35;padding:4px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.paliers li:hover{background:var(--paper)}
.paliers li.proche{border-color:var(--line);background:var(--paper)}
.paliers li.choisi{border-color:var(--accent);background:var(--paper);font-weight:500}
.paliers li b{font:600 13px var(--sans);text-align:center;color:var(--muted)}
.ro .paliers li{cursor:default}
.suggestion{font-size:13px;margin-top:6px;padding:5px 8px;background:var(--paper);border-radius:6px}
.suggestion button{margin-left:6px;font-size:12.5px;padding:2px 8px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer}
.justif{margin-top:12px} .justif label{font-size:12.5px;color:var(--muted)}
.justif textarea,.carnet textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font:15px/1.5 var(--serif);resize:vertical}
.btn-modeles{font-size:12.5px;padding:2px 9px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;margin-left:8px;color:var(--muted)}
.modeles{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 12px;display:grid;gap:10px}
.modele{font:14.5px/1.5 var(--serif)} .modele .src{font:600 12.5px var(--sans);color:var(--muted)}
.modele p{margin:2px 0} .modele .amorce{font-style:italic}
.modele button{font:12px var(--sans);padding:1px 8px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;margin-left:6px}
.carnet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:26px 0 10px}
.carnet h2{font:600 20px var(--serif);margin:0 0 4px}
.carnet textarea{min-height:220px}
.lecture{font-size:13px;color:var(--warn)}
#filtre{display:flex;gap:14px;align-items:center;font-size:14px;margin:18px 0 8px} #filtre h2{font:600 20px var(--serif);margin:0;margin-right:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px 24px;width:min(900px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h2{font:600 22px var(--serif);margin:0 0 10px}
table.recap{border-collapse:collapse;width:100%;font-size:13.5px}
table.recap th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
table.recap td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.recap tr.manque td:first-child{border-left:3px solid var(--warn)}
table.recap .aller{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
@media (max-width:760px){ .chiffres .grille{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>
<div class="barre"><a href="index.html" class="marque" title="Accueil de PRISME">PRISME</a><span id="qui"></span></div>

<section id="accueil" class="wrap">
  <h1>Évaluer un jeu</h1>
  <p class="aide">Choisis un jeu : si tu as déjà une fiche dessus, elle s'ouvre là où tu l'avais laissée. Chaque saisie est enregistrée automatiquement. Les fiches des autres évaluateurs se consultent en lecture seule.</p>
  <div class="choix">
    <div><label for="sel-jeu">Jeu</label><select id="sel-jeu"></select></div>
    <button class="btn" id="ouvrir" type="button">Ouvrir ma fiche</button>
    <button class="btn ghost" id="btn-ajout" type="button">Ajouter un jeu</button>
    <span class="msg" id="msg-accueil"></span>
  </div>
  <div class="choix hidden" id="form-ajout">
    <div><label for="nouveau-jeu">Nom du jeu</label><input id="nouveau-jeu" type="text"></div>
    <div><label for="nouveau-bgg">Lien BoardGameGeek (facultatif)</label><input id="nouveau-bgg" type="text" placeholder="https://boardgamegeek.com/boardgame/…"></div>
    <button class="btn" id="creer" type="button">Créer et ouvrir la fiche</button>
    <button class="btn ghost" id="annuler-ajout" type="button">Annuler</button>
    <p class="msg" id="msg-ajout" style="flex-basis:100%;margin:0"></p>
  </div>
  <div id="filtre" class="hidden"><h2>Les fiches</h2>
    <label><input type="radio" name="qui" value="miennes" checked> Mes fiches</label>
    <label><input type="radio" name="qui" value="toutes"> Toutes les fiches</label></div>
  <div id="fiches"></div>
</section>

<section id="fiche" class="hidden">
  <div id="barre-fiche">
    <button class="btn ghost" id="retour" type="button">← Les fiches</button>
    <span class="jeu" id="titre-jeu"></span><span class="lecture" id="lecture"></span>
    <span class="prog"><span id="prog"></span></span><span id="prog-txt" style="font-size:13px;color:var(--muted)"></span>
    <button class="btn ghost" id="suivante" type="button">Paire suivante à remplir</button>
    <select id="aller" aria-label="Aller à une paire"><option value="">Aller à…</option></select>
    <button class="btn ghost" id="btn-recap" type="button">Récapitulatif</button>
    <button class="btn ghost" id="btn-export" type="button">Exporter</button>
    <label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="finale"> Fiche finale</label>
    <span id="etat"></span>
  </div>
  <div class="wrap" id="grille"></div>
</section>
<div id="pied" class="hidden"></div>
<dialog id="dlg-recap"><div id="recap"></div><p style="text-align:right;margin:12px 0 0"><button class="btn" id="fermer-recap" type="button">Fermer</button></p></dialog>
<div class="wrap"><p class="version" id="version"></p></div>

<script>
const VERSION = { numero:"2.1", date:"2026-10-04 18:54" };   // à incrémenter à chaque livraison
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";   // clé publique : protégée par les droits de la base
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const fmt = (v, d = 1) => Number(v).toFixed(d).replace(".", ",");
$("#version").textContent = `Évaluation des jeux ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")}`;

/* ---- connexion : tout passe par la Forge (portail commun, à la racine du site) ---- */
const versForge = () => "../?retour=" + encodeURIComponent(location.href);
function afficherCompte(u){
  $("#qui").innerHTML = u ? `<span>${esc(u.email)}</span> <a href="#" id="deconnexion">Se déconnecter</a>` : `<a href="${versForge()}">Se connecter</a>`;
  $("#deconnexion")?.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}

const M = {};                 // modèle PRISMEgame
let user = null, role = null, noms = {};
let toutes = [], valeurs = [];   // toutes les fiches visibles et leurs notes
let fiche = null;            // { id, jeu, statut, evaluateur, pages… notes_article }
let saisie = {};             // axe -> { valeur, sans_objet, commentaire }
let lectureSeule = false;
let enAttente = new Set(), ficheModifiee = false, minuteur = null;
const CHAMPS = ["pages","prix","joueurs_min","joueurs_max","duree_min","duree_max"];

function courbeS(x0){ const t = (x0 + 2) / 9; return t <= .5 ? 10 * t * t : 5 * (1 - 2 * (1 - t) * (1 - t)); }

/* ---------------- démarrage ---------------- */
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  user = session?.user || null;
  if (!user){ location.replace(versForge()); return; }   // page réservée : on passe par la Forge
  afficherCompte(user);
  if (!demarre){ demarre = true; setTimeout(demarrer, 0); }
});
async function lireTout(table, filtre){
  const tout = [];
  for (let debut = 0; ; debut += 1000){
    let q = sb.from(table).select("*"); if (filtre) q = filtre(q);
    const { data, error } = await q.range(debut, debut + 999);
    if (error) throw error; tout.push(...data); if (data.length < 1000) return tout;
  }
}
async function demarrer(){
  const { data: r } = await sb.rpc("prisme_mon_role"); role = r;
  if (!["proprietaire","editeur","evaluateur"].includes(role)){
    $("#accueil").innerHTML = '<h1>Évaluer un jeu</h1><p class="aide">Ton compte n\'a pas le rôle d\'évaluateur dans PRISME. Le propriétaire peut te l\'attribuer.</p>'; return;
  }
  try {
    const lire = (t, o) => lireTout(t, q => q.order(o));
    [M.chapitres, M.paires, M.axes, M.paliers, M.exemples, M.jeux] = await Promise.all([lire("prisme_chapitres","ordre"), lire("prisme_paires","ordre"),
      lire("prisme_axes","ordre"), lire("prisme_paliers","valeur"), lire("prisme_exemples","ordre"), lire("prisme_jeux","nom")]);
    const { data: n } = await sb.rpc("prisme_noms"); (n || []).forEach(x => noms[x.user_id] = x.nom);
  } catch (e){ $("#msg-accueil").className = "msg err"; $("#msg-accueil").textContent = "Lecture du modèle impossible : " + e.message; return; }
  M.paires.sort((a, b) => M.chapitres.find(c => c.code === a.chapitre).ordre - M.chapitres.find(c => c.code === b.chapitre).ordre || a.ordre - b.ordre);
  remplirJeux(); await chargerFiches(); afficherFiches();
}
async function chargerFiches(){
  [toutes, valeurs] = await Promise.all([lireTout("prisme_evaluations", q => q.order("modifie_le", { ascending:false })), lireTout("prisme_evaluation_valeurs")]);
}
const nomJeu = c => M.jeux.find(j => j.code === c)?.nom || c;
const nomDe = id => id === user.id ? "moi" : (noms[id] || "un évaluateur");
const saisieDe = id => { const s = {}; valeurs.filter(v => v.evaluation === id).forEach(v => s[v.axe] = { valeur: v.valeur == null ? null : Number(v.valeur), sans_objet: v.sans_objet, commentaire: v.commentaire }); return s; };

/* ---------------- liste des fiches ---------------- */
document.querySelectorAll('input[name="qui"]').forEach(r => r.addEventListener("change", afficherFiches));
function afficherFiches(){
  const miennes = document.querySelector('input[name="qui"]:checked').value === "miennes";
  const L = toutes.filter(e => !miennes || e.evaluateur === user.id);
  $("#filtre").classList.toggle("hidden", !toutes.length);
  if (!L.length){ $("#fiches").innerHTML = `<p class="aide">${miennes ? "Tu n'as encore évalué aucun jeu." : "Aucune fiche pour l'instant."}</p>`; return; }
  $("#fiches").innerHTML = `<table class="fiches"><thead><tr><th>Jeu</th><th>Évaluateur</th><th>État</th><th>Paires</th><th>Note finale</th><th>Modifiée</th></tr></thead><tbody>
    ${L.map(e => { const c = calculer(saisieDe(e.id)); return `<tr class="f" data-id="${esc(e.id)}"><td><b>${esc(nomJeu(e.jeu))}</b></td><td>${esc(nomDe(e.evaluateur))}</td>
      <td><span class="badge ${esc(e.statut)}">${e.statut === "finale" ? "finale" : "brouillon"}</span></td><td>${c.faites} / ${M.paires.length}</td>
      <td>${c.finale == null ? "—" : fmt(c.finale, 2)}</td><td>${new Date(e.modifie_le).toLocaleString("fr-FR")}</td></tr>`; }).join("")}</tbody></table>`;
  document.querySelectorAll("#fiches tr.f").forEach(tr => tr.addEventListener("click", () => ouvrirFiche(toutes.find(e => e.id === tr.dataset.id))));
}

/* ---------------- ajout d'un jeu (contrôle des doublons, lien BGG) ---------------- */
const cleJeu = s => norm(s).replace(/[^a-z0-9]/g, "");
function numeroBGG(t){ const s = String(t ?? "").trim(); if (!s) return null; const m = s.match(/boardgame(?:expansion)?\/(\d+)/i) || s.match(/^(\d+)$/); return m ? Number(m[1]) : undefined; }
function doublons(nom, bgg, jeux){
  const k = cleJeu(nom), exact = jeux.find(j => cleJeu(j.nom) === k || (bgg && j.bgg_id === bgg));
  const proches = exact ? [] : jeux.filter(j => { const kj = cleJeu(j.nom); return k.length >= 4 && kj.length >= 4 && (kj.includes(k) || k.includes(kj)); });
  return { exact, proches };
}
function remplirJeux(choix){
  $("#sel-jeu").innerHTML = `<option value="">Choisir un jeu…</option>` + M.jeux.map(j => `<option value="${esc(j.code)}">${esc(j.nom)}</option>`).join("");
  if (choix) $("#sel-jeu").value = choix;
}
let confirmeProche = null;
$("#btn-ajout").addEventListener("click", () => { $("#form-ajout").classList.remove("hidden"); $("#msg-ajout").textContent = ""; $("#nouveau-jeu").focus(); });
$("#annuler-ajout").addEventListener("click", () => { $("#form-ajout").classList.add("hidden"); $("#nouveau-jeu").value = ""; $("#nouveau-bgg").value = ""; confirmeProche = null; });
$("#nouveau-jeu").addEventListener("input", () => { confirmeProche = null; $("#msg-ajout").textContent = ""; });
$("#creer").addEventListener("click", async () => {
  const m = $("#msg-ajout"); m.className = "msg";
  const nom = $("#nouveau-jeu").value.trim(), bgg = numeroBGG($("#nouveau-bgg").value);
  if (!nom){ m.className = "msg err"; m.textContent = "Indique le nom du jeu."; return; }
  if (bgg === undefined){ m.className = "msg err"; m.textContent = "Lien BoardGameGeek illisible : colle l'adresse de la page du jeu, ou son numéro."; return; }
  const { exact, proches } = doublons(nom, bgg, M.jeux);
  if (exact){ remplirJeux(exact.code); $("#form-ajout").classList.add("hidden"); $("#msg-accueil").className = "msg ok"; $("#msg-accueil").textContent = `« ${exact.nom} » est déjà dans la liste : je l'ai sélectionné.`; return; }
  if (proches.length && confirmeProche !== cleJeu(nom)){ confirmeProche = cleJeu(nom); m.className = "msg err"; m.textContent = `Jeux proches déjà présents : ${proches.map(j => j.nom).join(", ")}. Si c'est bien un autre jeu, clique à nouveau sur « Créer ».`; return; }
  let code = slug(nom), n = 2; while (M.jeux.some(j => j.code === code)) code = slug(nom) + "-" + n++;
  const { data, error } = await sb.from("prisme_jeux").insert({ code, nom, bgg_id: bgg }).select();
  if (error){ m.className = "msg err"; m.textContent = "Ajout du jeu refusé : " + error.message; return; }
  M.jeux.push(data[0]); M.jeux.sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  remplirJeux(code); $("#form-ajout").classList.add("hidden"); $("#nouveau-jeu").value = ""; $("#nouveau-bgg").value = ""; confirmeProche = null;
  ouvrirJeu(code);
});
$("#ouvrir").addEventListener("click", () => { const c = $("#sel-jeu").value; if (!c){ $("#msg-accueil").className = "msg err"; $("#msg-accueil").textContent = "Choisis un jeu, ou ajoute-le."; return; } ouvrirJeu(c); });
function ouvrirJeu(code){
  $("#msg-accueil").textContent = "";
  ouvrirFiche(toutes.find(e => e.jeu === code && e.evaluateur === user.id) || { id:null, jeu:code, statut:"brouillon", evaluateur:user.id });

/* ---------------- ouvrir une fiche ---------------- */
function ouvrirFiche(f){
  fiche = { ...f }; saisie = f.id ? saisieDe(f.id) : {}; enAttente = new Set(); ficheModifiee = false;
  lectureSeule = f.evaluateur !== user.id;
  $("#accueil").classList.add("hidden"); $("#fiche").classList.remove("hidden"); $("#pied").classList.remove("hidden");
  $("#titre-jeu").textContent = nomJeu(f.jeu);
  $("#lecture").textContent = lectureSeule ? `Fiche de ${nomDe(f.evaluateur)}, en lecture seule` : "";
  $("#finale").checked = f.statut === "finale"; $("#finale").disabled = lectureSeule;

  $("#etat").textContent = lectureSeule ? "" : (f.id ? "Fiche reprise." : "Nouvelle fiche : elle sera créée à la première saisie.");
  construireGrille(); recalculer(); window.scrollTo(0, 0);

$("#retour").addEventListener("click", async () => {
  if (enAttente.size || ficheModifiee){ clearTimeout(minuteur); await enregistrer(); }
  $("#fiche").classList.add("hidden"); $("#pied").classList.add("hidden"); $("#accueil").classList.remove("hidden");
  await chargerFiches(); afficherFiches();
});

/* ---------------- la grille ---------------- */
const axesDe = code => M.axes.filter(a => a.paire === code).sort((a, b) => a.ordre - b.ordre);
const paliersDe = code => M.paliers.filter(p => p.axe === code).sort((a, b) => a.valeur - b.valeur);
const MECA = { liee:"paire liée : l'axe 2 juge l'écart à l'attente", independante:"deux notes indépendantes", crans5:"axe 2 en cinq crans", composite:"note composite" };
const estEcart = (p, a) => a.rang === "2" && (p.mecanisme === "liee" || p.mecanisme === "crans5");

// notes factuelles proposées à partir du « jeu en chiffres »
function suggestion(axe){
  const d = fiche, palier = (x, seuils) => { let i = 0; while (i < seuils.length && x > seuils[i]) i++; return i; };
  if (axe === "POI1" && d.pages) return { v: palier(d.pages, [2, 8, 16, 32, 64]), source: d.pages + " pages" };
  if (axe === "VAL1" && d.prix != null && d.prix !== "") return { v: palier(Number(d.prix), [19.99, 40, 70, 120, 200]), source: fmt(d.prix, 0) + " €" };
  if (axe === "SCAL1" && d.joueurs_max){ const j = d.joueurs_max; return { v: j <= 1 ? 0 : palier(j, [2, 4, 6, 9]) + 1, source: (d.joueurs_min ? d.joueurs_min + " à " : "jusqu'à ") + j + " joueurs" }; }
  return null;
}
function reperes(axe){
  const ex = M.exemples.filter(x => x.axe === axe && x.valeur_texte).map(x => `${esc(nomJeu(x.jeu))} ${esc(x.valeur_texte)}`);
  const ids = id => toutes.find(e => e.id === id);
  const miens = valeurs.filter(v => v.axe === axe && v.valeur != null && !v.sans_objet && ids(v.evaluation)?.evaluateur === user.id && ids(v.evaluation)?.jeu !== fiche.jeu)
    .map(v => `${esc(nomJeu(ids(v.evaluation).jeu))} ${fmt(v.valeur)}`);
  const autres = valeurs.filter(v => v.axe === axe && v.valeur != null && !v.sans_objet && ids(v.evaluation)?.jeu === fiche.jeu && ids(v.evaluation)?.id !== fiche.id)
    .map(v => `${esc(nomDe(ids(v.evaluation).evaluateur))} ${fmt(v.valeur)}`);
  return [ex.length ? `Modop : ${ex.join(", ")}` : "", miens.length ? `Mes autres jeux : ${miens.join(", ")}` : "", autres.length ? `Autres fiches sur ce jeu : ${autres.join(", ")}` : ""]
    .filter(Boolean).map(t => `<div class="reperes">${t}</div>`).join("");
}
function blocAxe(p, axe){
  const ecart = estEcart(p, axe), s = saisie[axe.code], v = s?.valeur;
  const min = ecart ? -2 : 0, max = ecart ? 2 : 5, milieu = ecart ? 0 : 2.5;
  const grad = ecart ? ["−−","−","=","+","++"] : ["0","1","2","3","4","5"];
  const pal = paliersDe(axe.code);
  const sug = !lectureSeule && suggestion(axe.code);
  return `<div class="axe" data-axe="${esc(axe.code)}">
    <div class="titre">${esc(axe.code)} — ${esc(axe.nom)}</div>${axe.question ? `<div class="q">${esc(axe.question)}</div>` : ""}
    <div class="ligne"><div class="piste"><input type="range" min="${min}" max="${max}" step="0.1" value="${v ?? milieu}" class="${v == null ? "vierge" : ""}" data-axe="${esc(axe.code)}" aria-label="${esc(axe.nom)}" ${lectureSeule ? "disabled" : ""}>
      <div class="grad">${grad.map(g => `<span>${g}</span>`).join("")}</div></div><span class="num">${v == null ? "—" : fmt(v)}</span></div>
    ${pal.length ? `<ul class="paliers">${pal.map(x => `<li data-v="${x.valeur}"><b>${esc(x.symbole || fmt(x.valeur, 0))}</b><span>${esc(x.libelle)}</span></li>`).join("")}</ul>` : ""}
    ${sug ? `<div class="suggestion">D'après le jeu en chiffres (${esc(sug.source)}) : <b>${sug.v}</b>${v === sug.v ? " ✓" : `<button type="button" data-appliquer="${esc(axe.code)}" data-v="${sug.v}">Appliquer</button>`}</div>` : ""}
    ${reperes(axe.code)}</div>`;
}
function construireGrille(){
  const d = fiche;
  let h = `<section class="chiffres ${lectureSeule ? "ro" : ""}"><h2>Le jeu en chiffres</h2>
    <p class="aide">Ces données proposent les notes factuelles (POIDS, VALEUR, SCALABILITÉ) et serviront à la timeline.</p>
    <div class="grille">${[["pages","Pages des règles"],["prix","Prix (€)"],["joueurs_min","Joueurs min."],["joueurs_max","Joueurs max."],["duree_min","Durée min. (min)"],["duree_max","Durée max. (min)"]]
      .map(([k, l]) => `<div><label for="d-${k}">${l}</label><input id="d-${k}" data-donnee="${k}" type="number" min="0" step="${k === "prix" ? "0.5" : "1"}" value="${d[k] ?? ""}" ${lectureSeule ? "disabled" : ""}></div>`).join("")}</div></section>`;
  $("#aller").innerHTML = '<option value="">Aller à…</option>';
  M.chapitres.forEach(c => {
    h += `<div class="chapitre" style="--chap:var(--${c.code})"><h2>${esc(c.nom)}<span class="moy" id="moy-${c.code}"></span></h2>`;
    M.paires.filter(p => p.chapitre === c.code).forEach(p => {
      const ax = axesDe(p.code), a1 = ax.find(a => a.rang === "1"), so = ax.some(a => saisie[a.code]?.sans_objet);
      const corps = p.mecanisme === "composite"
        ? blocAxe(p, a1) + `<div class="pile">${ax.filter(a => a.rang === "2a" || a.rang === "2b").map(a => blocAxe(p, a)).join("")}</div>`
        : blocAxe(p, a1) + blocAxe(p, ax.find(a => a.rang === "2"));
      h += `<div class="paire${so ? " sans-objet" : ""}${lectureSeule ? " ro" : ""}" id="p-${esc(p.code)}" data-paire="${esc(p.code)}">
        <div class="tete" data-replier="${esc(p.code)}"><h3>${esc(p.nom)}</h3><span class="meca">${MECA[p.mecanisme] || ""}</span><span class="note" id="note-${esc(p.code)}"></span><span class="fleche">▾</span></div>
        <div class="corps"><label class="na"><input type="checkbox" data-na="${esc(p.code)}" ${so ? "checked" : ""} ${lectureSeule ? "disabled" : ""}> Sans objet pour ce jeu (exclu de la moyenne)</label>
        <div class="axes">${corps}</div><div class="res" id="res-${esc(p.code)}"></div>
        <div class="justif"><label for="j-${esc(p.code)}">Justification (facultative)</label>${boutonModeles(p, ax)}
          <textarea id="j-${esc(p.code)}" rows="1" data-justif="${esc(a1.code)}" ${lectureSeule ? "disabled" : ""} placeholder="Pourquoi ces notes ?">${esc(saisie[a1.code]?.commentaire || "")}</textarea>
          <div class="modeles hidden" id="m-${esc(p.code)}"></div></div></div></div>`;
      $("#aller").insertAdjacentHTML("beforeend", `<option value="p-${esc(p.code)}">${esc(c.nom)} — ${esc(p.nom)}</option>`);
    });
    h += "</div>";
  });
  h += `<section class="carnet"><h2>Carnet d'article</h2>
    <p class="aide">Idées, anecdotes de partie, citations, plan : tout ce qui servira à écrire un article sur ce jeu. Visible par les autres évaluateurs, comme le reste de la fiche.</p>
    <textarea id="carnet" ${lectureSeule ? "disabled" : ""}>${esc(fiche.notes_article || "")}</textarea></section>`;
  $("#grille").innerHTML = h;
  document.querySelectorAll(".axe").forEach(majPaliers);
  M.paires.forEach(p => { if (estComplete(p, saisie)) document.getElementById("p-" + p.code).classList.add("repliee"); });   // ce qui est fait se replie
}
/* ---- textes modèles : les exemples rédigés dans le modop (justifications, amorces littéraires) ---- */
const modelesDe = ax => M.exemples.filter(x => ax.some(a => a.code === x.axe) && (x.justification || x.amorce));
function boutonModeles(p, ax){
  const n = modelesDe(ax).length;
  return (!lectureSeule && n) ? `<button type="button" class="btn-modeles" data-modeles="${esc(p.code)}">Modèles (${n})</button>` : "";
}
function afficherModeles(code){
  const box = document.getElementById("m-" + code);
  if (!box.classList.contains("hidden")){ box.classList.add("hidden"); return; }
  const ax = axesDe(code);
  box.innerHTML = modelesDe(ax).map((x, i) => `<div class="modele">
      <div class="src">${esc(nomJeu(x.jeu))}, ${esc(x.axe)} ${esc(x.valeur_texte || "")}</div>
      ${x.justification ? `<p>${esc(x.justification)}<button type="button" data-inserer="justif" data-paire="${esc(code)}" data-ex="${esc(x.code)}">Insérer</button></p>` : ""}
      ${x.amorce ? `<p class="amorce">${esc(x.amorce)}<button type="button" data-inserer="carnet" data-ex="${esc(x.code)}">Au carnet</button></p>` : ""}</div>`).join("")
    + '<p class="aide" style="margin:0">« Insérer » reprend le texte dans la justification, « Au carnet » ajoute l\'amorce au carnet d\'article : à toi ensuite de l\'adapter à ce jeu.</p>';
  box.classList.remove("hidden");
}
function ajouterTexte(champ, texte){
  champ.value = champ.value.trim() ? champ.value.trimEnd() + "\n" + texte : texte;
  champ.dispatchEvent(new Event("input", { bubbles:true }));
  champ.focus();
}

function majPaliers(div){
  const code = div.dataset.axe, v = saisie[code]?.valeur, lis = div.querySelectorAll(".paliers li");
  if (!lis.length) return;
  const ref = v ?? Number(div.querySelector("input").value);
  let best = null; lis.forEach(li => { li.classList.remove("proche", "choisi"); if (!best || Math.abs(+li.dataset.v - ref) < Math.abs(+best.dataset.v - ref)) best = li; });
  best.classList.add(v == null ? "proche" : "choisi");
}

/* ---------------- calcul ---------------- */
function noteDe(p, s){
  const ax = axesDe(p.code), val = r => s[ax.find(a => a.rang === r)?.code]?.valeur;
  if (ax.some(a => s[a.code]?.sans_objet)) return { complete:true, so:true, note:null };
  if (p.mecanisme === "composite"){
    const t1 = val("1"), a = val("2a"), b = val("2b");
    return (t1 != null && a != null && b != null) ? { complete:true, note:(b * t1 + a * (5 - t1)) / 5 } : { complete:false, note:null };
  }
  const v1 = val("1"), v2 = val("2");
  if (v1 != null && p.na_si_axe1_nul && Math.round(v1) === 0) return { complete:true, na1:true, note:null };
  if (v1 == null || v2 == null) return { complete:false, note:null };
  return { complete:true, note: p.mecanisme === "liee" ? courbeS(v1 + v2) : p.mecanisme === "crans5" ? 2.5 + v2 * 1.25 : v2 };
}
const estComplete = (p, s) => noteDe(p, s).complete;
function calculer(s){
  const parChap = {}; let faites = 0;
  M.paires.forEach(p => { const n = noteDe(p, s); if (n.complete) faites++; (parChap[p.chapitre] ??= []).push({ p, ...n }); });
  const moy = L => { const n = L.filter(x => x.note != null).map(x => x.note); return n.length ? n.reduce((a, b) => a + b, 0) / n.length : null; };
  const chap = Object.fromEntries(Object.entries(parChap).map(([c, L]) => [c, moy(L)]));
  const cs = Object.values(chap).filter(x => x != null);
  return { parChap, chap, finale: cs.length ? cs.reduce((a, b) => a + b, 0) / cs.length : null, faites };
}
function recalculer(){
  const c = calculer(saisie);
  Object.values(c.parChap).flat().forEach(({ p, note, so, na1, complete }) => {
    $("#res-" + p.code).innerHTML = so ? "Sans objet pour ce jeu." : note != null ? `Note retenue : <b>${fmt(note, 2)}</b>` :
      na1 ? "Axe 2 sans objet : l'axe 1 vaut 0." : "En attente des notes.";
    $("#note-" + p.code).textContent = so ? "sans objet" : note != null ? fmt(note, 2) : "";
    document.getElementById("p-" + p.code).classList.toggle("faite", complete);
  });
  M.chapitres.forEach(ch => { const v = c.chap[ch.code]; $("#moy-" + ch.code).textContent = v == null ? "" : fmt(v, 2) + " / 5"; });
  $("#prog").style.width = (c.faites / M.paires.length * 100) + "%";
  $("#prog-txt").textContent = `${c.faites} / ${M.paires.length}`;
  $("#pied").innerHTML = M.chapitres.map(ch => `<div><small>${esc(ch.nom)}</small><b>${c.chap[ch.code] == null ? "—" : fmt(c.chap[ch.code], 2)}</b></div>`).join("") +
    `<div class="final"><small>Évaluation finale</small><b>${c.finale == null ? "—" : fmt(c.finale, 2)}</b></div>`;
  return c;
}

/* ---------------- saisie ---------------- */
function poser(code, v){
  const s = saisie[code] || {};
  saisie[code] = { valeur: Math.round(v * 10) / 10, sans_objet: s.sans_objet || false, commentaire: s.commentaire ?? null };
  const div = document.querySelector(`.axe[data-axe="${CSS.escape(code)}"]`);
  const inp = div.querySelector("input"); inp.value = v; inp.classList.remove("vierge");
  div.querySelector(".num").textContent = fmt(v);
  majPaliers(div);
  const sg = div.querySelector(".suggestion"); if (sg){ const b = sg.querySelector("button"); if (b && +b.dataset.v === v) b.replaceWith(" ✓"); }
  recalculer(); planifier(code);
}
$("#grille").addEventListener("input", e => {
  if (lectureSeule) return;
  if (e.target.type === "range") poser(e.target.dataset.axe, Number(e.target.value));
  else if (e.target.dataset.justif){ const c = e.target.dataset.justif, s = saisie[c] || { valeur:null, sans_objet:false };
    saisie[c] = { ...s, commentaire: e.target.value.trim() || null }; e.target.rows = Math.min(5, 1 + Math.floor(e.target.value.length / 90)); planifier(c); }
  else if (e.target.dataset.donnee){ const k = e.target.dataset.donnee; fiche[k] = e.target.value === "" ? null : Number(e.target.value); ficheModifiee = true; planifier();
    rafraichirSuggestions(); }
  else if (e.target.id === "carnet"){ fiche.notes_article = e.target.value; ficheModifiee = true; planifier(); }
});
function rafraichirSuggestions(){
  ["POI1","VAL1","SCAL1"].forEach(code => {
    const div = document.querySelector(`.axe[data-axe="${code}"]`); if (!div) return;
    div.querySelector(".suggestion")?.remove();
    const sug = suggestion(code), v = saisie[code]?.valeur; if (!sug) return;
    div.querySelector(".paliers")?.insertAdjacentHTML("afterend", `<div class="suggestion">D'après le jeu en chiffres (${esc(sug.source)}) : <b>${sug.v}</b>${v === sug.v ? " ✓" : `<button type="button" data-appliquer="${code}" data-v="${sug.v}">Appliquer</button>`}</div>`);
  });
}
$("#grille").addEventListener("click", e => {
  const bm = e.target.closest("[data-modeles]");
  if (bm){ afficherModeles(bm.dataset.modeles); return; }
  const ins = e.target.closest("[data-inserer]");
  if (ins){
    const x = M.exemples.find(y => y.code === ins.dataset.ex);
    if (ins.dataset.inserer === "justif") ajouterTexte(document.getElementById("j-" + ins.dataset.paire), x.justification);
    else { ajouterTexte($("#carnet"), `${x.amorce}  (modèle : ${nomJeu(x.jeu)})`); ins.textContent = "Ajouté ✓"; }
    return;
  }
  const li = e.target.closest(".paliers li");
  if (li && !lectureSeule){ poser(li.closest(".axe").dataset.axe, Number(li.dataset.v)); return; }
  const ap = e.target.closest("[data-appliquer]");
  if (ap){ poser(ap.dataset.appliquer, Number(ap.dataset.v)); return; }
  const t = e.target.closest("[data-replier]");
  if (t) document.getElementById("p-" + t.dataset.replier).classList.toggle("repliee");
});
$("#grille").addEventListener("change", e => {
  if (!e.target.dataset.na || lectureSeule) return;
  const p = e.target.dataset.na, on = e.target.checked;
  axesDe(p).forEach(a => { const s = saisie[a.code] || {}; saisie[a.code] = { valeur: s.valeur ?? null, sans_objet: on, commentaire: s.commentaire ?? null }; planifier(a.code); });
  document.getElementById("p-" + p).classList.toggle("sans-objet", on); recalculer();
});
// clavier : sur un curseur, les chiffres posent directement la note (0 à 5 ; pour un écart, 1 à 5 = −− à ++)
document.addEventListener("keydown", e => {
  const t = e.target; if (lectureSeule || t.type !== "range" || !/^[0-5]$/.test(e.key)) return;
  const n = Number(e.key), ecart = t.min === "-2";
  if (ecart && n === 0) return;
  e.preventDefault(); poser(t.dataset.axe, ecart ? n - 3 : n);
});
$("#suivante").addEventListener("click", () => {
  const p = M.paires.find(x => !estComplete(x, saisie));
  M.paires.forEach(x => { if (estComplete(x, saisie)) document.getElementById("p-" + x.code).classList.add("repliee"); });
  if (!p){ $("#etat").textContent = "Toutes les paires sont remplies."; return; }
  const el = document.getElementById("p-" + p.code); el.classList.remove("repliee"); el.scrollIntoView({ behavior:"smooth" });
  el.querySelector('input[type="range"]')?.focus({ preventScroll:true });
});
$("#aller").addEventListener("change", e => { if (e.target.value){ const el = document.getElementById(e.target.value); el.classList.remove("repliee"); el.scrollIntoView({ behavior:"smooth" }); } e.target.value = ""; });
$("#finale").addEventListener("change", e => { fiche.statut = e.target.checked ? "finale" : "brouillon"; ficheModifiee = true; planifier(); });

/* ---------------- enregistrement automatique ---------------- */
function planifier(code){
  if (lectureSeule) return;
  if (code) enAttente.add(code);
  $("#etat").textContent = "Enregistrement…";
  clearTimeout(minuteur); minuteur = setTimeout(enregistrer, 1200);
}
async function enregistrer(){
  if (lectureSeule) return;
  const champs = Object.fromEntries(CHAMPS.map(k => [k, fiche[k] ?? null]));
  if (!fiche.id){
    const { data, error } = await sb.from("prisme_evaluations").insert({ jeu: fiche.jeu, statut: fiche.statut, version_appli: VERSION.numero, notes_article: fiche.notes_article ?? null, ...champs }).select();
    if (error){ $("#etat").textContent = "Création de la fiche refusée : " + error.message; return; }
    fiche.id = data[0].id; fiche.evaluateur = data[0].evaluateur; ficheModifiee = false;
  } else if (ficheModifiee || enAttente.size){
    ficheModifiee = false;
    const { error } = await sb.from("prisme_evaluations").update({ statut: fiche.statut, version_appli: VERSION.numero, notes_article: fiche.notes_article ?? null, ...champs }).eq("id", fiche.id);
    if (error){ ficheModifiee = true; $("#etat").textContent = "Enregistrement impossible : " + error.message; return; }
  }
  const codes = [...enAttente]; enAttente = new Set();
  if (codes.length){
    const lignes = codes.map(c => ({ evaluation: fiche.id, axe: c, valeur: saisie[c].valeur ?? null, sans_objet: !!saisie[c].sans_objet, commentaire: saisie[c].commentaire ?? null }));
    const { error } = await sb.from("prisme_evaluation_valeurs").upsert(lignes, { onConflict: "evaluation,axe" });
    if (error){ codes.forEach(c => enAttente.add(c)); $("#etat").textContent = "Enregistrement impossible : " + error.message + ". Nouvel essai à la prochaine saisie."; return; }
  }
  $("#etat").textContent = "Enregistré à " + new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }).replace(":", "h") + ".";
}
window.addEventListener("beforeunload", e => { if (enAttente.size || ficheModifiee){ e.preventDefault(); e.returnValue = ""; } });

/* ---------------- récapitulatif et export ---------------- */
function lignesRecap(){
  return M.paires.map(p => {
    const ax = axesDe(p.code), n = noteDe(p, saisie), a1 = ax.find(a => a.rang === "1");
    const notes = ax.map(a => { const v = saisie[a.code]?.valeur; return `${a.code} ${v == null ? "—" : (estEcart(p, a) && v > 0 ? "+" : "") + fmt(v)}`; }).join(" · ");
    return { p, n, notes, justif: saisie[a1.code]?.commentaire || "", chap: M.chapitres.find(c => c.code === p.chapitre).nom };
  });
}
$("#btn-recap").addEventListener("click", () => {
  const c = calculer(saisie), L = lignesRecap(), manque = L.filter(l => !l.n.complete);
  $("#recap").innerHTML = `<h2>${esc(nomJeu(fiche.jeu))} : récapitulatif</h2>
    <p class="aide">${manque.length ? `Il manque ${manque.length} paire${manque.length > 1 ? "s" : ""} : ${manque.map(l => esc(l.p.nom)).join(", ")}.` : "Les quinze paires sont remplies."}
      Note finale : <b>${c.finale == null ? "—" : fmt(c.finale, 2)}</b> (${M.chapitres.map(ch => `${esc(ch.nom)} ${c.chap[ch.code] == null ? "—" : fmt(c.chap[ch.code], 2)}`).join(", ")}).</p>
    <table class="recap"><thead><tr><th>Paire</th><th>Saisie</th><th>Note retenue</th><th>Justification</th></tr></thead><tbody>
    ${L.map(l => `<tr class="${l.n.complete ? "" : "manque"}"><td><span class="aller" data-aller="${esc(l.p.code)}">${esc(l.p.nom)}</span></td><td>${l.notes}</td>
      <td>${l.n.so ? "sans objet" : l.n.note == null ? (l.n.na1 ? "axe 2 sans objet" : "—") : fmt(l.n.note, 2)}</td><td>${esc(l.justif)}</td></tr>`).join("")}</tbody></table>`;
  $("#recap").querySelectorAll("[data-aller]").forEach(x => x.addEventListener("click", () => {
    $("#dlg-recap").close(); const el = document.getElementById("p-" + x.dataset.aller); el.classList.remove("repliee"); el.scrollIntoView({ behavior:"smooth" }); }));
  $("#dlg-recap").showModal();
});
$("#fermer-recap").addEventListener("click", () => $("#dlg-recap").close());
// export en Markdown : de quoi démarrer un article
$("#btn-export").addEventListener("click", () => {
  const c = calculer(saisie), L = lignesRecap(), d = fiche;
  const chiffres = [d.pages && `${d.pages} pages de règles`, d.prix != null && d.prix !== "" && `${fmt(d.prix, 0)} €`,
    d.joueurs_max && `${d.joueurs_min || "?"} à ${d.joueurs_max} joueurs`, d.duree_max && `${d.duree_min || "?"} à ${d.duree_max} minutes`].filter(Boolean).join(", ");
  let md = `# ${nomJeu(d.jeu)}\n\nFiche PRISMEgame de ${noms[d.evaluateur] || "l'évaluateur"}, ${d.statut === "finale" ? "finale" : "brouillon"}, exportée le ${new Date().toLocaleDateString("fr-FR")}.\n\n`;
  if (chiffres) md += `**Le jeu en chiffres** : ${chiffres}.\n\n`;
  md += `**Note finale : ${c.finale == null ? "—" : fmt(c.finale, 2)}** (${M.chapitres.map(ch => `${ch.nom} ${c.chap[ch.code] == null ? "—" : fmt(c.chap[ch.code], 2)}`).join(", ")})\n`;
  M.chapitres.forEach(ch => {
    md += `\n## ${ch.nom}\n`;
    L.filter(l => l.p.chapitre === ch.code).forEach(l => {
      md += `\n### ${l.p.nom} : ${l.n.so ? "sans objet" : l.n.note == null ? "—" : fmt(l.n.note, 2)}\n\n${l.notes}\n`;
      if (l.justif) md += `\n> ${l.justif}\n`;
    });
  });
  if (d.notes_article) md += `\n## Carnet d'article\n\n${d.notes_article}\n`;
  const url = URL.createObjectURL(new Blob([md], { type:"text/markdown" }));
  const a = Object.assign(document.createElement("a"), { href:url, download:`prisme_${d.jeu}_${new Date().toLocaleDateString("sv-SE")}.md` });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
});
</script>
