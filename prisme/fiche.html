<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISME — Mon profil de joueur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F6F5F1;--panel:#FFFFFF;--accent:#3D2645;--arch:#888;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--accent:#C9B4D2}}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:inherit}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:inherit!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)}
.barre a{text-decoration:none}
#qui a{margin-left:10px}

main{max-width:860px;margin:0 auto;padding:10px 24px 40px}
.entete{border-top:10px solid var(--arch);background:var(--panel);border-radius:12px;padding:22px 26px 20px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.entete .surtitre{font-size:13px;color:var(--muted);margin:0}
.entete h1{font:600 clamp(36px,6vw,54px)/1.05 var(--serif);margin:4px 0 6px}
.entete .filiation{font:italic 19px/1.4 var(--serif);color:var(--muted);margin:0}
/* les trois niveaux, du plus partagé (moteur, 1 joueur sur 5) au plus singulier (style, 1 sur 60) */
.entete h1.niveaux{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font:600 clamp(26px,4.4vw,40px)/1.15 var(--serif);margin:8px 0 4px}
.niveaux .niv{display:inline-flex;flex-direction:column}
.niveaux small{font:500 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.niveaux .arch{font-size:clamp(38px,6.5vw,60px);line-height:1.05;color:var(--arch)}
.niveaux .prof{color:color-mix(in srgb, var(--arch) 55%, var(--ink))}
.niveaux .sous{font-size:.85em;color:color-mix(in srgb, var(--sous) 80%, var(--ink))}
.niveaux .sep{color:var(--line);font-weight:400}
@media (max-width:520px){ .niveaux .sep{display:none} }
.entete .date{font-size:13px;color:var(--muted);margin:10px 0 0}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 26px;margin-top:16px}
section h2{font:600 22px/1.25 var(--serif);margin:0 0 2px}
section .question{font:italic 15px var(--serif);color:var(--muted);margin:0 0 12px}
section p{margin:0 0 10px;font:16.5px/1.65 var(--serif)}
.devise{font-style:italic;color:var(--muted)}
.libelle{font:600 13px var(--sans);color:var(--muted);display:block;margin-bottom:1px}
/* les cinq moteurs, du plus fort au plus faible */
.moteurs{display:grid;gap:8px}
.moteur{display:grid;grid-template-columns:118px 1fr 58px;gap:12px;align-items:center}
.moteur .nom{font-weight:500}
.moteur .piste{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.moteur .plein{display:block;height:100%;border-radius:7px}
.moteur .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.moteur .role{grid-column:2 / 4;font-size:12.5px;color:var(--muted);margin:-6px 0 2px}
section ul{margin:2px 0 12px;padding-left:20px;font:16px/1.55 var(--serif)}
.fb{font-size:14px;color:var(--muted)}
/* timeline */
.timeline svg{width:100%;height:auto;display:block}
.timeline .note{font-size:13px;color:var(--muted);margin:8px 0 0}
#vos-jeux table.pj-jeux{font-size:15px}
.version{font-size:12px;color:var(--muted);text-align:right;margin-top:24px}
.vide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 26px;font:italic 18px/1.5 var(--serif);color:var(--muted)}
.vide a{color:var(--ink)}
@media (max-width:700px){ .trois{grid-template-columns:1fr} .moteur{grid-template-columns:96px 1fr 50px} main{padding:8px 14px 30px} section,.entete{padding:18px} }
</style>
</head>
<body>
<div class="barre"><a href="index.html" class="marque" title="Accueil de PRISME">PRISME</a><span id="qui"></span></div>
<main id="contenu"><p class="vide">Chargement…</p></main>
<main><p class="version" id="version"></p></main>

<script src="timeline.js?v=1.4"></script>
<script>
const VERSION = { numero:"2.0", date:"2026-10-10 23:00" };   // à incrémenter à chaque livraison
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";   // clé publique : protégée par les droits de la base
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maj = s => { s = String(s ?? ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const puces = t => `<ul>${String(t ?? "").split("\n").filter(Boolean).map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
$("#version").textContent = `Fiche du joueur ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")} · timeline ${TIMELINE_VERSION.numero}`;


/* ---- connexion : tout passe par la Forge (portail commun, à la racine du site) ---- */
const versForge = () => "../?retour=" + encodeURIComponent(location.href);
function afficherCompte(u){
  const el = document.getElementById("qui");
  el.innerHTML = u ? `<span>${String(u.email).replace(/[&<>"']/g, "")}</span> <a href="#" id="deconnexion">Se déconnecter</a>`
                   : `<a href="${versForge()}">Se connecter</a>`;
  const d = document.getElementById("deconnexion");
  if (d) d.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  if (!session?.user){ location.replace(versForge()); return; }   // page réservée : on passe par la Forge
  afficherCompte(session.user);
  if (!demarre){ demarre = true; setTimeout(() => afficher(session?.user || null), 0); }
});

const vide = html => $("#contenu").innerHTML = `<p class="vide">${html}</p>`;

async function afficher(user){
  if (!user) return;
  const id = new URLSearchParams(location.search).get("resultat");
  let q = sb.from("prisme_player_resultats").select("*");
  q = id ? q.eq("id", id) : q.eq("user_id", user.id).order("passe_le", { ascending:false }).limit(1);
  const { data: res, error } = await q;
  if (error) return vide("Lecture impossible : " + esc(error.message));
  const r = res?.[0];
  if (!r) return vide(id ? "Ce résultat n'existe pas, ou vous n'avez pas le droit de le voir."
                         : 'Vous n\'avez pas encore de profil de joueur. <a href="questionnaire.html">Passer le questionnaire</a>.');
  const c = r.classement, code = r.style || (c ? c[0] + "." + c[1].toLowerCase() + "/" + c[4].toLowerCase() : null);
  const [{ data: st }, { data: mot }] = await Promise.all([
    sb.from("prisme_player_vue_styles").select("*").eq("code", code).single(),
    sb.from("prisme_player_moteurs").select("*").order("ordre")
  ]);
  if (!st) return vide("Ce résultat date d'une version précédente du modèle et n'a pas de style. <a href=\"questionnaire.html\">Repasser le questionnaire</a>.");
  const { data: tem } = await sb.from("prisme_player_temperaments").select("*").eq("code", st.temperament).single();
  const M = Object.fromEntries(mot.map(m => [m.code, m])), dom = M[st.moteur];
  const autre = r.user_id !== user.id;
  document.documentElement.style.setProperty("--arch", dom.couleur || "#888");
  document.title = `PRISME — ${maj(st.nom)}`;

  const ordre = r.classement.split("");
  const moteurs = ordre.map((c, i) => {
    const m = M[c], pct = Number(r.scores?.[c] ?? 0);
    const role = i === 0 ? "votre moteur dominant" : i === 1 ? "votre second moteur : il donne votre style" : i === 4 ? "le moteur que vous fuyez : il fait décrocher" : "";
    return `<div class="moteur"><span class="nom">${esc(m.nom)}</span>
      <span class="piste"><span class="plein" style="width:${Math.min(100, pct)}%;background:${m.couleur}"></span></span>
      <span class="pct">${pct.toFixed(1).replace(".", ",")} %</span>
      ${role ? `<span class="role">${role}</span>` : ""}</div>`;
  }).join("");

  $("#contenu").innerHTML = `
    <div class="entete">
      <p class="surtitre">${autre ? "Profil de joueur" : "Mon profil de joueur"}</p>
      <h1 class="niveaux">
        <span class="niv arch"><small>moteur</small>${esc(dom.nom)}</span><span class="sep" aria-hidden="true">›</span>
        <span class="niv prof"><small>tempérament</small>${esc(maj(st.temperament_nom))}</span><span class="sep" aria-hidden="true">›</span>
        <span class="niv sous" style="--sous:${esc(M[st.second]?.couleur || "var(--ink)")}"><small>style</small>${esc(maj(st.nom))}</span></h1>
      <p class="date">Questionnaire du ${new Date(r.passe_le).toLocaleDateString("fr-FR")}.${autre ? "" : ' <a href="questionnaire.html">Le modifier ou le refaire</a>. <a href="rosace.html">Voir ma place sur la rosace</a>.'}</p>
    </div>

    <section><h2>Vos moteurs</h2><p class="question">Ce qui vous met en mouvement à la table, du plus fort au plus faible.</p>
      <div class="moteurs">${moteurs}</div></section>

    <section><h2>${esc(dom.nom)}</h2><p class="question">Pourquoi je joue ? Votre moteur.</p>
      <p class="devise">${esc(dom.devise)}${dom.citation ? ` · « ${esc(dom.citation)} »` : ""}</p>
      <p>${esc(dom.texte)}</p>
      ${dom.a_la_table ? `<span class="libelle">À la table, il peut</span>${puces(dom.a_la_table)}` : ""}</section>

    <section><h2>${esc(maj(tem.nom))}</h2><p class="question">Ce que je cherche, ce que je fuis : votre tempérament (${esc(dom.nom)}, fuit ${esc(M[tem.fuit].nom)}).</p>
      <p>${esc(tem.qui_il_est)}</p>
      <span class="libelle">À la table, il peut</span>${puces(tem.a_la_table)}
      <p><span class="libelle">Quand il décroche</span>${esc(tem.quand_decroche)}</p>
      ${tem.fb_verbe ? `<p class="fb">Dans Flamme Bleue : ${esc(tem.fb_verbe)} (« ${esc(tem.fb_devise)} »).</p>` : ""}</section>

    <section><h2>${esc(maj(st.nom))}</h2><p class="question">Avec quoi je le vis : votre style.</p>
      <p>${st.texte ? esc(st.texte) : `Style ${esc(st.code)} : ${esc(st.temperament_nom)}, avec ${esc(st.second_nom)} en second moteur.`}</p>
      <p><span class="libelle">Second moteur</span>${esc(st.second_nom)} : ${esc(M[st.second].devise)}.</p></section>

    <section class="timeline"><h2>Votre moment</h2><p class="question">Où culmine votre intérêt au fil des parties ?</p>
      ${frise(st, dom)}
      <p class="note">Hypothèse de travail du modèle, pas encore validée sur des cas réels.</p></section>

    <section id="vos-jeux"><h2>${autre ? "Ses jeux" : "Vos jeux"}</h2><p class="question">Les jeux évalués dans PRISME, vus par ${autre ? "ce" : "votre"} style de joueur.</p>
      <div id="vos-jeux-corps"><p class="pj-discret">Calcul en cours…</p></div></section>`;
  afficherVosJeux(code, autre);
}
async function afficherVosJeux(code, autre){
  const box = $("#vos-jeux-corps"), d = await lireJeuxEvalues(sb);
  if (d.refus){ box.innerHTML = `<p class="pj-discret">Les jeux évalués sont réservés aux membres de PRISME pour l'instant.</p>`; return; }
  const L = jeuxPourJoueurs(d.fiches, d.paires, d.axes, null, [code]);
  box.innerHTML = tableJeuxHTML(L, d, autre ? "ce joueur" : "vous", false);
}

// frise des jalons 0 à 7+, avec la zone d'apogée du moteur dominant
function frise(sp, m){
  const W = 760, x = j => 30 + j * 90, y = 70;
  const phases = [["Accès",1,2],["Expérimentations",3,4],["Aguerrissement",5,6],["Habitude",6,7]];
  const demi = { "courte":0.5, "moyenne":0.9, "longue (étendue)":1.6 }[sp.duree_apogee] ?? 0.9;
  let zone;
  if (sp.climax_jalon == null){   // transversal : prolonge l'apogée des autres
    zone = `<rect x="${x(1)}" y="${y-26}" width="${x(7.6)-x(1)}" height="26" rx="6" fill="${m.couleur}" opacity=".22"/>
      <text x="${(x(1)+x(7.6))/2}" y="${y-36}" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Transversal : vous prolongez l'apogée, quelle que soit la phase</text>`;
  } else {
    const c = Number(sp.climax_jalon);
    zone = `<rect x="${x(c-demi)}" y="${y-26}" width="${x(c+demi)-x(c-demi)}" height="26" rx="6" fill="${m.couleur}" opacity=".3"/>
      <circle cx="${x(c)}" cy="${y-13}" r="7" fill="${m.couleur}"/>
      <text x="${x(c)}" y="${y-36}" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">${esc(sp.climax_phase)}, apogée ${esc(sp.duree_apogee)}</text>`;
  }
  const graduations = [0,1,2,3,4,5,6,7].map(j => `<line x1="${x(j)}" y1="${y}" x2="${x(j)}" y2="${y+7}" stroke="currentColor" opacity=".5"/>
    <text x="${x(j)}" y="${y+24}" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".7">${j === 7 ? "7+" : j}</text>`).join("");
  const noms = phases.map(([n,a,b]) => `<text x="${(x(a)+x(b))/2}" y="${y+44}" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">${n}</text>`).join("");
  return `<svg viewBox="0 0 ${W} 122" role="img" aria-label="Frise des parties, de la découverte à l'exploitation">
    ${zone}<line x1="${x(0)}" y1="${y}" x2="${x(7.6)}" y2="${y}" stroke="currentColor" stroke-width="1.5" opacity=".6"/>${graduations}${noms}</svg>`;
}
</script>
<script src="entete.js?v=1.2"></script>
</body>
</html>
