<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F4F6F8;--panel:#FFFFFF;--hover:#EEF1F5;--ok:#1E7A46;--warn:#9A5B00;--err:#B42318;

@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--hover:#1E2630;--ok:#5CC98A;--warn:#E0A84A;--err:#F2837A}}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit} :focus-visible{outline:2px solid #3B6FE0;outline-offset:2px} .hidden{display:none!important}
header{display:flex;align-items:baseline;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.wordmark{font:600 24px/1 var(--serif);letter-spacing:.02em;margin:0} .signature{font:italic 14px/1.4 var(--serif);color:var(--muted);margin:0}
header a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:5px} header a:hover{background:var(--hover);color:var(--ink)}
.who{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)} .btn:disabled{opacity:.4;cursor:default}
.msg{font-size:14px;min-height:1.4em;margin:6px 0 0} .msg.err{color:var(--err)} .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
.outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px 0;max-width:1500px;margin:auto}
.outils select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-width:340px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:14px 20px 40px;max-width:1500px;margin:auto;align-items:start}
#scene{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
#scene svg{width:100%;height:auto;display:block}
#scene .el{cursor:pointer;transition:opacity .2s}
#scene .el:hover{filter:brightness(1.06)}
#scene.focus .el.eteint{opacity:.16}
#scene .el.choisi{outline:none}
aside{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
aside h2{font:600 22px/1.2 var(--serif);margin:4px 0 2px} aside .code{font:600 13px var(--sans);color:var(--muted)}
aside .devise{font:italic 15px/1.35 var(--serif);color:var(--muted)} aside .titre{font:italic 15px/1.45 var(--serif);margin-top:8px}
aside .texte{font:15px/1.6 var(--serif);margin-top:8px;white-space:pre-line} aside .vide{color:var(--muted);font:italic 15px/1.5 var(--serif)}
.legende{font-size:13px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.bloque{max-width:560px;margin:60px auto;padding:0 20px;font:italic 17px/1.5 var(--serif);color:var(--muted)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:4px 20px;text-align:right;font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:24px;width:min(380px,92vw)} dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h2{font:600 22px var(--serif);margin:0 0 14px} .field{display:block;margin-bottom:12px} .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
@media (max-width:1000px){main{grid-template-columns:1fr} aside{position:static}}
</style>

const M = window.FLAMME_MOTEUR;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let E = {}, user = null, role = null, svgCourant = "";
$("#version").textContent = `Rosace ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")}`;

/* Découpage d'une devise sur deux lignes : port de ScinderLigne (seuil 18) */
function scinder(texte, seuil = 18){
  texte = String(texte || "").trim();
  if (texte.length <= seuil) return [texte, ""];
  const milieu = texte.length / 2;
  let pv = 0, dv = Infinity;
  [...texte].forEach((c, k) => { const i = k + 1; if (c === "," && Math.abs(i - milieu) < dv){ dv = Math.abs(i - milieu); pv = i; } });
  if (pv) return [texte.slice(0, pv).trim(), texte.slice(pv).trim()];
  let tout = 0, dt = Infinity, valide = 0, dva = Infinity, court = 0, dc = Infinity;
  for (let i = 1; i <= texte.length; i++){
    if (texte[i - 1] !== " ") continue;
    const d = Math.abs(i - milieu);
    if (d < dt){ dt = d; tout = i; }
    const debAvant = texte.lastIndexOf(" ", i - 2) + 1;           // position (1-based) de l'espace précédent
    const lAvant = i - (debAvant + 1);
    let finApres = texte.indexOf(" ", i) + 1; if (finApres === 0) finApres = texte.length + 1;
    const lApres = finApres - (i + 1);
    if (!(lAvant >= 1 && lAvant <= 3)){
      if (d < dva){ dva = d; valide = i; }
      if (lApres >= 1 && lApres <= 3 && d < dc){ dc = d; court = i; }
    }
  }
  const pos = court || valide || tout;
  if (!pos) return [texte, ""];
  return [texte.slice(0, pos - 1).trim(), texte.slice(pos).trim()];
}

/* Couleurs d'un code : présentes (majuscules et minuscules avant « / ») et absentes (après « / ») */
function couleursDe(code){
  const [av, ap = ""] = code.split("/");
  return { pres: new Set(av.replace(".", "").toUpperCase()), abs: new Set(ap.toUpperCase()) };
}

function construireSVG(profil){
  let cible = null;
  if (profil){ const a = M.analyser(profil); cible = { pres: new Set(a.principales + a.secondaires), abs: new Set(a.absentes) }; }
  const parts = GABARIT.parts.map(p => {
    let s = p.svg;
    if (p.code){
      const e = E[p.code] || {};
      const [d1, d2] = scinder(e.devise);
      s = s.replace("{{nom}}", esc(e.nom ?? p.code)).replace("{{devise}}", esc(e.devise ?? ""))
           .replace("{{d1}}", esc(d1)).replace("{{d2}}", esc(d2));
      let eteint = "";
      if (cible){
        const c = couleursDe(p.code);
        const ok = [...c.pres].every(x => cible.pres.has(x)) && [...c.abs].every(x => cible.abs.has(x));
        eteint = ok ? "" : " eteint";
      }
      return `<g class="el${eteint}" data-code="${esc(p.code)}">${s}</g>`;
    }
    return s;
  }).join("\n");
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".28"/></filter>
<style>${GABARIT.css}
.el.eteint{opacity:.16}</style>
${GABARIT.defs.join("\n")}
</defs>
${parts}
</svg>`;
}
function dessiner(){
  const p = $("#profil").value;
  ["#lien-fiche", "#lien-ecusson", "#lien-detail"].forEach(s => $(s).classList.toggle("hidden", !p));
  if (p){ $("#lien-fiche").href = "fiche.html?type=" + encodeURIComponent(p); $("#lien-detail").href = "detail.html?type=" + encodeURIComponent(p); $("#lien-ecusson").href = "ecusson.html?type=" + encodeURIComponent(p); }
  svgCourant = construireSVG(p);
  $("#scene").innerHTML = svgCourant;
  $("#msg").textContent = p ? `En lumière : les éléments compatibles avec ${p} (${E[p]?.nom || ""}) — couleurs présentes et absentes du profil.` : "";
}

/* ---------- fiche ---------- */
$("#scene").addEventListener("click", e => {
  const g = e.target.closest(".el"); if (!g) return;
  const code = g.dataset.code, f = E[code] || {};
  const texte = [f.texte1, f.texte2, f.texte3].filter(Boolean).join("\n\n");
  $("#fiche").innerHTML = `<div class="code">${esc(code)} — ${esc(f.couche || "")}</div><h2>${esc(f.nom || code)}</h2>
    <div class="devise">${esc(f.devise || "")}</div>${f.titre && f.titre !== f.devise ? `<div class="titre">« ${esc(f.titre)} »</div>` : ""}
    ${texte ? `<div class="texte">${esc(texte)}</div>` : ""}
    <p class="legende"><a href="console.html">Modifier dans la console</a></p>`;
});

/* ---------- exports ---------- */
function telecharger(nom, blob){ const u = URL.createObjectURL(blob); const a = Object.assign(document.createElement("a"), { href:u, download:nom }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
const nomFichier = ext => `flamme_rosace${$("#profil").value ? "_" + $("#profil").value.replace(/[/.]/g, "-") : ""}_${new Date().toLocaleDateString("sv-SE")}.${ext}`;
$("#dl-svg").addEventListener("click", () => telecharger(nomFichier("svg"), new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svgCourant], { type:"image/svg+xml" })));
$("#dl-png").addEventListener("click", () => {
  const img = new Image();
  img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 1800; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,1800,1800); x.drawImage(img, 0, 0, 1800, 1800); c.toBlob(b => telecharger(nomFichier("png"), b), "image/png"); };
  img.onerror = () => { $("#msg").className = "msg err"; $("#msg").textContent = "Export PNG impossible dans ce navigateur."; };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgCourant);
});
$("#profil").addEventListener("change", () => { dessiner(); history.replaceState(null, "", $("#profil").value ? "?profil=" + encodeURIComponent($("#profil").value) : location.pathname); });

/* ---------- accès ---------- */
$("#btn-login").addEventListener("click", () => { $("#login-msg").textContent = ""; $("#dlg-login").showModal(); });
$("#login-fermer").addEventListener("click", () => $("#dlg-login").close());
$("#btn-logout").addEventListener("click", () => sb.auth.signOut());
$("#form-login").addEventListener("submit", async e => { e.preventDefault(); const m = $("#login-msg"); m.className = "msg"; m.textContent = "Connexion…";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error){ m.className = "msg err"; m.textContent = /invalid/i.test(error.message) ? "Adresse ou mot de passe incorrect." : error.message; } else $("#dlg-login").close(); });

sb.auth.onAuthStateChange(async (_e, session) => {
  const u = session?.user || null; if (u?.id === user?.id && role !== null) return;
  user = u; role = null;
  $("#btn-login").classList.toggle("hidden", !!user); $("#btn-logout").classList.toggle("hidden", !user);
  $("#who").textContent = user ? user.email : "";
  $("#contenu").classList.add("hidden"); $("#bloque").classList.remove("hidden");
  if (!user){ $("#bloque").textContent = "La rosace est réservée. Connecte-toi pour l'afficher."; return; }
  const { data: r } = await sb.rpc("mon_role"); role = r || "";
  if (!ACCES.includes(role)){ $("#bloque").textContent = "Ton compte n'a pas accès à la rosace pour l'instant."; return; }
  const { data, error } = await sb.from("elements").select("*");
  if (error){ $("#bloque").textContent = "Lecture de la base impossible : " + error.message; return; }
  E = Object.fromEntries(data.map(e => [e.code, e]));
  const profils = data.filter(e => e.couche === "profil").sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0));
  $("#profil").innerHTML = '<option value="">aucun</option>' + profils.map(p => `<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.nom)}</option>`).join("");
  const demande = new URLSearchParams(location.search).get("profil");
  if (demande && E[demande]) $("#profil").value = demande;
  $("#bloque").classList.add("hidden"); $("#contenu").classList.remove("hidden");
  dessiner();
});
